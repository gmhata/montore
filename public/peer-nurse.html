<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>piamontore - 看護師役</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; background: #f4f6f8; color: #263238; min-height: 100vh; }
  header { background: #00695c; color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; font-weight: 600; }
  header .badge { background: rgba(255,255,255,.2); border-radius: 4px; padding: 2px 8px; font-size: 12px; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  .panel { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 16px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  label { font-size: 14px; }
  input[type=text] { padding: 8px 10px; border: 1px solid #b0bec5; border-radius: 6px; font-size: 15px; width: 200px; }
  button { padding: 9px 18px; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; background: #00695c; color: #fff; }
  button:hover { filter: brightness(1.1); }
  button:disabled { background: #b0bec5; cursor: default; }
  button.secondary { background: #eceff1; color: #37474f; }
  #status { font-size: 13px; color: #607d8b; margin-top: 10px; white-space: pre-wrap; }
  .videos { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
  .videobox { background: #000; border-radius: 10px; overflow: hidden; position: relative; aspect-ratio: 16/9; }
  .videobox video { width: 100%; height: 100%; object-fit: contain; background:#000; }
  .videobox .tag { position: absolute; left: 10px; top: 10px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; padding: 3px 10px; border-radius: 4px; z-index: 2; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>piamontore 問診ピア練習</h1>
  <span class="badge">看護師役(実写)</span>
  <span id="userinfo" style="margin-left:auto;font-size:13px;"></span>
</header>
<main>
  <div class="panel" id="setupPanel">
    <div class="row">
      <button id="loginBtn">Googleでログイン</button>
      <label>ルーム名: <input type="text" id="roomInput" value="renshu1"></label>
      <button id="joinBtn" disabled>入室する</button>
      <button id="leaveBtn" class="secondary hidden">退室</button>
    </div>
    <div class="row" style="margin-top:10px;">
      <label>カメラ: <select id="cameraSelect" style="padding:7px 10px;border:1px solid #b0bec5;border-radius:6px;font-size:15px;"><option value="">既定のカメラ</option></select></label>
      <span style="font-size:12px;color:#607d8b;">入室前に選択してください</span>
    </div>
    <div id="status">ログインしてください。</div>
  </div>
  <div class="videos">
    <div class="videobox">
      <span class="tag">患者(相手)</span>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
    <div class="videobox">
      <span class="tag">自分(看護師役)</span>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
  </div>
</main>

<script src="/firebase-config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, getIdToken }
  from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

const ROLE = "nurse";
const app = initializeApp(window.FIREBASE_CONFIG);
const auth = getAuth(app);
const $ = (id) => document.getElementById(id);
const setStatus = (msg) => { $("status").textContent = msg; };
{ const _r = new URLSearchParams(location.search).get("room"); if (_r) $("roomInput").value = _r; }

// カメラ選択
async function listCameras(){
  try{
    const devs = await navigator.mediaDevices.enumerateDevices();
    const cams = devs.filter(d => d.kind === "videoinput");
    const sel = $("cameraSelect"); const cur = sel.value;
    sel.innerHTML = '<option value="">既定のカメラ</option>' + cams.map((c,i)=>`<option value="${c.deviceId}">${c.label||("カメラ"+(i+1))}</option>`).join("");
    if (cur) sel.value = cur;
  }catch(e){}
}
if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) navigator.mediaDevices.addEventListener("devicechange", listCameras);
listCameras();

let lkRoom = null;
let localTracks = [];

onAuthStateChanged(auth, (user) => {
  if (user) {
    $("userinfo").textContent = user.email || "";
    $("loginBtn").classList.add("hidden");
    $("joinBtn").disabled = false;
    setStatus("ルーム名を患者役と合わせて「入室する」を押してください。");
  } else {
    $("joinBtn").disabled = true;
  }
});

$("loginBtn").onclick = async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { setStatus("ログイン失敗: " + e.message); }
};

async function fetchToken(room) {
  const idToken = await getIdToken(auth.currentUser, true);
  const r = await fetch("/api/peer/token", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + idToken },
    body: JSON.stringify({ room, role: ROLE }),
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}

function attachRemoteTrack(track) {
  if (track.kind === "video") {
    track.attach($("remoteVideo"));
  } else if (track.kind === "audio") {
    const el = track.attach();
    el.id = "remoteAudio";
    document.body.appendChild(el);
  }
}

$("joinBtn").onclick = async () => {
  const roomName = $("roomInput").value.trim();
  if (!roomName) { setStatus("ルーム名を入力してください"); return; }
  $("joinBtn").disabled = true;
  try {
    // カメラ・マイクは可能なら取得するが、使えなくても受信専用で入室する。
    // （内蔵カメラをUE等が使用中=Device in use、カメラ無し、権限拒否などに対応）
    setStatus("カメラ・マイクを取得中...");
    let stream = null;
    let mode = "";
    try {
      const camId = $("cameraSelect").value;
      const videoConstraints = { width: { ideal: 1280 }, height: { ideal: 720 } };
      if (camId) videoConstraints.deviceId = { exact: camId };
      stream = await navigator.mediaDevices.getUserMedia({
        video: videoConstraints,
        audio: { echoCancellation: true, noiseSuppression: true },
      });
      mode = "camera+mic";
      listCameras();
    } catch (eCam) {
      console.warn("カメラ取得失敗、音声のみを試行:", eCam?.message || eCam);
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true },
        });
        mode = "audio-only";
      } catch (eAud) {
        console.warn("マイク取得も失敗、受信専用で入室:", eAud?.message || eAud);
        stream = null;
        mode = "receive-only";
      }
    }
    localTracks = stream ? stream.getTracks() : [];
    const localVid = stream ? stream.getVideoTracks() : [];
    $("localVideo").srcObject = localVid.length ? new MediaStream(localVid) : null;
    if (mode === "audio-only") setStatus("カメラが使えないため音声のみで参加します...");
    else if (mode === "receive-only") setStatus("カメラ・マイクが使えないため受信専用で参加します...");

    setStatus("接続情報を取得中...");
    const { url, token } = await fetchToken(roomName);

    setStatus("通話サーバへ接続中...");
    lkRoom = new LivekitClient.Room({ adaptiveStream: true, dynacast: true });
    lkRoom.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => attachRemoteTrack(track));
    lkRoom.on(LivekitClient.RoomEvent.ParticipantConnected, (p) => setStatus("相手が入室しました: " + (p.name || p.identity)));
    lkRoom.on(LivekitClient.RoomEvent.ParticipantDisconnected, () => setStatus("相手が退室しました。"));
    lkRoom.on(LivekitClient.RoomEvent.Disconnected, () => setStatus("切断されました。"));
    await lkRoom.connect(url, token);
    for (const t of localTracks) await lkRoom.localParticipant.publishTrack(t);

    $("leaveBtn").classList.remove("hidden");
    const others = lkRoom.remoteParticipants ? lkRoom.remoteParticipants.size : 0;
    const modeNote = mode === "camera+mic" ? "" : (mode === "audio-only" ? "(音声のみ)" : "(受信専用)");
    setStatus("入室しました" + modeNote + "(ルーム: " + roomName + ")。" + (others ? "相手は入室済みです。" : "患者役の入室を待っています..."));
  } catch (e) {
    console.error(e);
    setStatus("エラー: " + e.message);
    $("joinBtn").disabled = false;
  }
};

$("leaveBtn").onclick = async () => {
  try { if (lkRoom) await lkRoom.disconnect(); } catch {}
  localTracks.forEach((t) => t.stop());
  localTracks = [];
  $("localVideo").srcObject = null;
  const ra = document.getElementById("remoteAudio"); if (ra) ra.remove();
  $("leaveBtn").classList.add("hidden");
  $("joinBtn").disabled = false;
  setStatus("退室しました。");
};
</script>
</body>
</html>
