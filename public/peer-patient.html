<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>piamontore - 患者役</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; background: #f4f6f8; color: #263238; min-height: 100vh; }
  header { background: #4527a0; color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; font-weight: 600; }
  header .badge { background: rgba(255,255,255,.2); border-radius: 4px; padding: 2px 8px; font-size: 12px; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  .panel { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 16px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  label { font-size: 14px; }
  input[type=text] { padding: 8px 10px; border: 1px solid #b0bec5; border-radius: 6px; font-size: 15px; width: 200px; }
  button { padding: 9px 18px; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; background: #4527a0; color: #fff; }
  button:hover { filter: brightness(1.1); }
  button:disabled { background: #b0bec5; cursor: default; }
  button.secondary { background: #eceff1; color: #37474f; }
  #status { font-size: 13px; color: #607d8b; margin-top: 10px; white-space: pre-wrap; }
  .note { font-size: 13px; background: #ede7f6; border-radius: 6px; padding: 10px 14px; margin-top: 12px; line-height: 1.7; }
  .videos { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
  .videobox { background: #000; border-radius: 10px; overflow: hidden; position: relative; aspect-ratio: 16/9; }
  .videobox video { width: 100%; height: 100%; object-fit: contain; background:#000; }
  .videobox .tag { position: absolute; left: 10px; top: 10px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; padding: 3px 10px; border-radius: 4px; z-index: 2; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>piamontore 問診ピア練習</h1>
  <span class="badge">患者役(アバター配信)</span>
  <span id="userinfo" style="margin-left:auto;font-size:13px;"></span>
</header>
<main>
  <div class="panel" id="setupPanel">
    <div class="row">
      <button id="loginBtn">Googleでログイン</button>
      <label>ルーム名: <input type="text" id="roomInput" value="renshu1"></label>
      <button id="joinBtn" disabled>アバター画面を選んで入室</button>
      <button id="leaveBtn" class="secondary hidden">退室</button>
    </div>
    <div class="row" style="margin-top:10px;">
      <label>患者の声(ペルソナ):
        <select id="personaSelect" style="padding:7px 10px;border:1px solid #b0bec5;border-radius:6px;font-size:15px;">
          <option value="0">なし(原声)</option>
          <option value="-4">高齢男性</option>
          <option value="-2">中年男性</option>
          <option value="-1">若年男性</option>
          <option value="2">高齢女性</option>
          <option value="3">中年女性</option>
          <option value="5">若年女性</option>
        </select>
      </label>
      <span style="font-size:12px;color:#78909c;">入室中でも切替できます</span>
    </div>
    <div id="status">ログインしてください。</div>
    <div class="note">
      入室ボタンを押すと画面選択ダイアログが開きます。「ウィンドウ」タブから
      <b>Unreal Engine(MetaHuman)のウィンドウ</b>を選択してください。
      その映像が「あなたの姿」として看護師役に届きます。声は上で選んだペルソナに合わせて
      リアルタイムに高さを変えて送られます(第1段階: ピッチ変換。より自然な声質変換はP4で検討)。
      UEをまだ使わない動作確認では、任意のウィンドウを選べばOKです。
    </div>
  </div>
  <div class="videos">
    <div class="videobox">
      <span class="tag">看護師(相手)</span>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
    <div class="videobox">
      <span class="tag">送信中のアバター映像</span>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
  </div>
</main>

<script src="/firebase-config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, getIdToken }
  from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

const ROLE = "patient";
const app = initializeApp(window.FIREBASE_CONFIG);
const auth = getAuth(app);
const $ = (id) => document.getElementById(id);
const setStatus = (msg) => { $("status").textContent = msg; };

/* ===== P1: ブラウザ内リアルタイム声変換(ピッチシフト) =====
   マイク音声を AudioWorklet(グラニュラー・ピッチシフター)に通し、
   ペルソナに応じた半音数だけ声の高さを変えて送出する。
   第1段階のためフォルマントは保持しない(ピッチと一緒に動く)。より自然な
   声質変換(フォルマント独立/AIボイチェン)はP4で検討。
   pitch≈1.0(なし)のときはパススルー(加工なし)。 */
let audioCtx = null;        // AudioContext
let pitchNode = null;       // AudioWorkletNode
let audioDest = null;       // MediaStreamAudioDestinationNode
let audioSource = null;     // MediaStreamAudioSourceNode

const semitoneToRatio = (semi) => Math.pow(2, Number(semi) / 12);

const PITCH_WORKLET_CODE = `
class PitchShiftProcessor extends AudioWorkletProcessor {
  static get parameterDescriptors() {
    return [{ name: 'pitch', defaultValue: 1.0, minValue: 0.25, maxValue: 4.0, automationRate: 'k-rate' }];
  }
  constructor() {
    super();
    this.bufferSize = 16384;
    this.buffer = new Float32Array(this.bufferSize);
    this.writeIndex = 0;
    this.grainSize = 3072; // 約64ms @48k
    this.phase = 0;        // 0..1(グレイン内位相)
  }
  readSample(idx) {
    const N = this.bufferSize;
    idx = ((idx % N) + N) % N;
    const i0 = Math.floor(idx);
    const i1 = (i0 + 1) % N;
    const frac = idx - i0;
    return this.buffer[i0] * (1 - frac) + this.buffer[i1] * frac;
  }
  process(inputs, outputs, params) {
    const input = inputs[0];
    const output = outputs[0];
    if (!output || output.length === 0) return true;
    const inCh = (input && input.length > 0) ? input[0] : null;
    const outCh = output[0];
    const pitch = params.pitch[0];
    const G = this.grainSize;
    const N = this.bufferSize;
    const passthrough = Math.abs(pitch - 1.0) < 1e-3;
    for (let i = 0; i < outCh.length; i++) {
      const s = inCh ? inCh[i] : 0;
      this.buffer[this.writeIndex] = s;
      if (passthrough) {
        outCh[i] = s;
      } else {
        const g1 = this.phase;
        const g2 = (this.phase + 0.5) % 1;
        const d1 = g1 * G;
        const d2 = g2 * G;
        const r1 = this.readSample(this.writeIndex - d1);
        const r2 = this.readSample(this.writeIndex - d2);
        const w1 = 0.5 - 0.5 * Math.cos(2 * Math.PI * g1);
        const w2 = 0.5 - 0.5 * Math.cos(2 * Math.PI * g2);
        outCh[i] = r1 * w1 + r2 * w2;
        this.phase += (1 - pitch) / G;
        if (this.phase >= 1) this.phase -= 1;
        else if (this.phase < 0) this.phase += 1;
      }
      this.writeIndex = (this.writeIndex + 1) % N;
    }
    // 他チャンネルにも同じ出力(モノラル運用)
    for (let c = 1; c < output.length; c++) output[c].set(outCh);
    return true;
  }
}
registerProcessor('pitch-shift', PitchShiftProcessor);
`;

// マイクストリームをピッチシフターに通し、送出用の音声トラックを返す
async function buildVoiceTrack(micStream) {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") { try { await audioCtx.resume(); } catch {} }
  const blob = new Blob([PITCH_WORKLET_CODE], { type: "application/javascript" });
  const url = URL.createObjectURL(blob);
  await audioCtx.audioWorklet.addModule(url);
  URL.revokeObjectURL(url);
  audioSource = audioCtx.createMediaStreamSource(micStream);
  pitchNode = new AudioWorkletNode(audioCtx, "pitch-shift", { outputChannelCount: [1] });
  audioDest = audioCtx.createMediaStreamDestination();
  audioSource.connect(pitchNode).connect(audioDest);
  applyPersona(); // 現在の選択を反映
  return audioDest.stream.getAudioTracks()[0];
}

function applyPersona() {
  if (!pitchNode) return;
  const semi = $("personaSelect").value;
  const ratio = semitoneToRatio(semi);
  const p = pitchNode.parameters.get("pitch");
  p.setValueAtTime(ratio, audioCtx ? audioCtx.currentTime : 0);
}
$("personaSelect").addEventListener("change", applyPersona);

function teardownVoice() {
  try { if (audioSource) audioSource.disconnect(); } catch {}
  try { if (pitchNode) pitchNode.disconnect(); } catch {}
  try { if (audioDest) audioDest.disconnect(); } catch {}
  try { if (audioCtx) audioCtx.close(); } catch {}
  audioSource = pitchNode = audioDest = audioCtx = null;
}

let lkRoom = null;
let localTracks = [];
let rawMicStream = null;

onAuthStateChanged(auth, (user) => {
  if (user) {
    $("userinfo").textContent = user.email || "";
    $("loginBtn").classList.add("hidden");
    $("joinBtn").disabled = false;
    setStatus("ルーム名を看護師役と合わせて入室してください。");
  } else {
    $("joinBtn").disabled = true;
  }
});

$("loginBtn").onclick = async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { setStatus("ログイン失敗: " + e.message); }
};

async function fetchToken(room) {
  const idToken = await getIdToken(auth.currentUser, true);
  const r = await fetch("/api/peer/token", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + idToken },
    body: JSON.stringify({ room, role: ROLE }),
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}

function attachRemoteTrack(track) {
  if (track.kind === "video") {
    track.attach($("remoteVideo"));
  } else if (track.kind === "audio") {
    const el = track.attach();
    el.id = "remoteAudio";
    document.body.appendChild(el);
  }
}

$("joinBtn").onclick = async () => {
  const roomName = $("roomInput").value.trim();
  if (!roomName) { setStatus("ルーム名を入力してください"); return; }
  $("joinBtn").disabled = true;
  try {
    setStatus("アバター画面(UEウィンドウ)を選択してください...");
    const screenStream = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: { ideal: 30 }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false,
    });
    setStatus("マイクを取得中...");
    rawMicStream = await navigator.mediaDevices.getUserMedia({
      // ピッチシフト側で加工するため、ここでは自動ゲイン等は最小限に
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: false },
    });
    setStatus("声変換を準備中...");
    const voiceTrack = await buildVoiceTrack(rawMicStream);
    // 送出するのは「加工後の音声」+「アバター画面(映像)」
    localTracks = [...screenStream.getVideoTracks(), voiceTrack];
    $("localVideo").srcObject = new MediaStream(screenStream.getVideoTracks());

    // 画面共有をブラウザのUIから停止された場合は退室扱いにする
    screenStream.getVideoTracks()[0].addEventListener("ended", () => $("leaveBtn").click());

    setStatus("接続情報を取得中...");
    const { url, token } = await fetchToken(roomName);

    setStatus("通話サーバへ接続中...");
    lkRoom = new LivekitClient.Room({ adaptiveStream: true, dynacast: true });
    lkRoom.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => attachRemoteTrack(track));
    lkRoom.on(LivekitClient.RoomEvent.ParticipantConnected, (p) => setStatus("相手が入室しました: " + (p.name || p.identity)));
    lkRoom.on(LivekitClient.RoomEvent.ParticipantDisconnected, () => setStatus("相手が退室しました。"));
    lkRoom.on(LivekitClient.RoomEvent.Disconnected, () => setStatus("切断されました。"));
    await lkRoom.connect(url, token);
    for (const t of localTracks) {
      await lkRoom.localParticipant.publishTrack(t, t.kind === "video" ? {
        videoCodec: "vp9",
        videoEncoding: { maxBitrate: 2_500_000, maxFramerate: 30 },
      } : undefined);
    }

    $("leaveBtn").classList.remove("hidden");
    const others = lkRoom.remoteParticipants ? lkRoom.remoteParticipants.size : 0;
    setStatus("入室しました(ルーム: " + roomName + ")。" + (others ? "相手は入室済みです。" : "看護師役の入室を待っています..."));
  } catch (e) {
    console.error(e);
    setStatus("エラー: " + e.message);
    $("joinBtn").disabled = false;
  }
};

$("leaveBtn").onclick = async () => {
  try { if (lkRoom) await lkRoom.disconnect(); } catch {}
  localTracks.forEach((t) => t.stop());
  localTracks = [];
  teardownVoice();
  if (rawMicStream) { rawMicStream.getTracks().forEach((t) => t.stop()); rawMicStream = null; }
  $("localVideo").srcObject = null;
  const ra = document.getElementById("remoteAudio"); if (ra) ra.remove();
  $("leaveBtn").classList.add("hidden");
  $("joinBtn").disabled = false;
  setStatus("退室しました。");
};
</script>
</body>
</html>
