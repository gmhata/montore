<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アバター調整ラボ — PeerMontore</title>
<style>
  body { font-family: system-ui, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif; margin:0; background:#0f1216; color:#e6edf3; }
  header { background:#4527a0; color:#fff; padding:10px 18px; }
  header h1 { font-size:16px; margin:0; }
  .wrap { display:flex; gap:18px; padding:16px; flex-wrap:wrap; align-items:flex-start; }
  .col { display:flex; flex-direction:column; gap:12px; }
  .stage { background:#000; border-radius:12px; overflow:hidden; position:relative; }
  #avatarCanvas { display:block; background:#0f1216; }
  #hud { position:absolute; left:8px; top:8px; font-size:11px; line-height:1.5; background:rgba(0,0,0,.55); padding:6px 8px; border-radius:6px; color:#9fe6b0; white-space:pre; pointer-events:none; }
  .selfie { position:relative; width:320px; height:240px; background:#000; border-radius:10px; overflow:hidden; }
  #selfVideo, #poseOverlay { position:absolute; left:0; top:0; width:320px; height:240px; }
  #selfVideo { transform:scaleX(-1); object-fit:cover; }
  .selfcap { font-size:11px; color:#8b949e; margin-top:4px; }
  .panel { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:14px 16px; min-width:300px; max-width:360px; }
  .panel h2 { font-size:13px; margin:0 0 10px; color:#c9d1d9; }
  .row { display:flex; align-items:center; gap:8px; margin:8px 0; flex-wrap:wrap; }
  label { font-size:13px; }
  select, button { font-size:14px; padding:7px 10px; border-radius:6px; border:1px solid #30363d; background:#21262d; color:#e6edf3; cursor:pointer; }
  button.primary { background:#4527a0; border-color:#4527a0; color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  input[type=range] { width:150px; }
  .val { font-size:12px; color:#8b949e; width:54px; display:inline-block; }
  .hint { font-size:12px; color:#8b949e; line-height:1.6; margin-top:10px; }
  .tag { font-size:12px; color:#8b949e; }
  #status { font-size:12px; color:#8b949e; margin-top:8px; white-space:pre-wrap; min-height:32px; }
  .sec { border-top:1px solid #30363d; margin-top:12px; padding-top:10px; }
</style>
</head>
<body>
<header><h1>アバター調整ラボ（Web版患者・顔＋手＋キャラ＋声）</h1></header>
<div class="wrap">
  <div class="col">
    <div class="stage">
      <canvas id="avatarCanvas" width="480" height="600"></canvas>
      <div id="hud">起動前</div>
    </div>
    <div>
      <div class="selfie">
        <video id="selfVideo" autoplay playsinline muted></video>
        <canvas id="poseOverlay" width="320" height="240"></canvas>
      </div>
      <div class="selfcap">↑ 自分ビュー：緑の線が検出中の腕。<b>肩・肘・手首がカメラに写る</b>ように座ってください。</div>
    </div>
  </div>

  <div class="panel">
    <h2>① キャラを選ぶ（声とアバターを一括設定）</h2>
    <div class="row">
      <label>キャラ:
        <select id="charSelect">
          <option value="none">なし（原声・標準）</option>
          <option value="kd">高齢男性</option>
          <option value="cd">中年男性</option>
          <option value="jd">若年男性</option>
          <option value="kj">高齢女性</option>
          <option value="cj">中年女性</option>
          <option value="jj" selected>若年女性</option>
        </select>
      </label>
    </div>
    <div class="row tag" id="voiceInfo">声プリセット: —</div>

    <div class="sec">
      <h2>② 開始</h2>
      <div class="row">
        <button class="primary" id="startBtn">カメラで開始</button>
        <button id="voiceBtn" disabled>声を試す（要ヘッドホン）</button>
      </div>
    </div>

    <div class="sec">
      <h2>③ 表示・調整</h2>
      <div class="row"><label><input type="checkbox" id="faceOn" checked> 顔の表情</label>
        <label><input type="checkbox" id="poseOn" checked> 手・腕</label></div>
      <div class="row"><label>フレーム</label><input type="range" id="frameZoom" min="0.8" max="2.4" step="0.05" value="1.6"><span class="val" id="frameZoomV">1.6</span></div>
      <div class="row"><label>腕の強さ</label><input type="range" id="armGain" min="0" max="1.3" step="0.05" value="1.0"><span class="val" id="armGainV">1.0</span></div>
      <div class="row"><label>なめらかさ</label><input type="range" id="smooth" min="0.08" max="0.6" step="0.02" value="0.35"><span class="val" id="smoothV">0.35</span></div>
      <div class="row">
        <label><input type="checkbox" id="mirror" checked> 左右反転(鏡)</label>
        <label><input type="checkbox" id="swapLR"> 腕の左右入替</label>
      </div>
      <div class="row"><label><input type="checkbox" id="flipZ"> 奥行き反転（前後が逆のとき）</label></div>
    </div>

    <div id="status">準備OK。「カメラで開始」を押してください。</div>
    <div class="hint">※腕が動かないときは、まず自分ビューの緑スケルトンが出ているか確認してください。出ていなければ椅子を引いて上半身全体を写します。緑は出るのに向きが変なときは「左右反転」「腕の左右入替」「奥行き反転」で合わせてください。</div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { FaceLandmarker, PoseLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
import { VoiceConverter, PERSONAS } from '/peer-voice.js';

const $ = (id) => document.getElementById(id);
const setStatus = (m) => { $("status").textContent = m; };
function banner(msg){ let b=document.getElementById('errbar'); if(!b){ b=document.createElement('div'); b.id='errbar'; b.style.cssText='position:fixed;left:0;top:0;right:0;z-index:9999;background:#b71c1c;color:#fff;font:13px/1.5 system-ui;padding:8px 12px;white-space:pre-wrap'; document.body.appendChild(b);} b.textContent='⚠ '+msg; }
window.addEventListener('error', e=>banner((e.message||'error')+'  @'+(e.filename||'').split('/').pop()+':'+e.lineno));
window.addEventListener('unhandledrejection', e=>banner('promise: '+((e.reason&&e.reason.message)||e.reason)));

const DEFAULT_AVATAR = "/avatar-f-brunette.glb";
const CHARACTERS = {
  none:{label:"なし",avatar:DEFAULT_AVATAR}, kd:{label:"高齢男性",avatar:DEFAULT_AVATAR}, cd:{label:"中年男性",avatar:DEFAULT_AVATAR},
  jd:{label:"若年男性",avatar:DEFAULT_AVATAR}, kj:{label:"高齢女性",avatar:DEFAULT_AVATAR}, cj:{label:"中年女性",avatar:DEFAULT_AVATAR}, jj:{label:"若年女性",avatar:DEFAULT_AVATAR},
};
function voiceOf(id){ return PERSONAS[id] || PERSONAS.none; }
function showVoiceInfo(id){ const v=voiceOf(id); $("voiceInfo").textContent = `声プリセット: ピッチ ${v.p>0?'+':''}${v.p}半音 / 太さ ${Math.round(v.f*100)}%`; }

function canon(s){ return String(s).toLowerCase().replace(/left$/,'l').replace(/right$/,'r').replace(/[^a-z0-9]/g,''); }
const FLOOR = 0.03;
const GAIN = {};
(function(){ const set=(n,g)=>{GAIN[canon(n)]=g;};
  [['eyeBlinkLeft',3.2],['eyeBlinkRight',3.2],['eyeLookInLeft',2.6],['eyeLookOutLeft',2.6],['eyeLookUpLeft',2.6],['eyeLookDownLeft',2.6],
   ['eyeLookInRight',2.6],['eyeLookOutRight',2.6],['eyeLookUpRight',2.6],['eyeLookDownRight',2.6],
   ['eyeSquintLeft',2.4],['eyeSquintRight',2.4],['eyeWideLeft',2.4],['eyeWideRight',2.4],
   ['cheekPuff',4.5],['cheekSquintLeft',2.6],['cheekSquintRight',2.6]].forEach(([n,g])=>set(n,g)); })();

let renderer, scene, camera, morphMeshes=[], headBone=null, faceLandmarker=null, poseLandmarker=null;
let running=false, lastVideoTime=-1, avatarRoot=null;
let lastPose=null, poseCount=0, faceCount=0, fpsT=performance.now(), fpsN=0, fps=0, lastPoseErr="";
const targetHeadWorld=new THREE.Quaternion(), headWorldRest=new THREE.Quaternion(), headParentWorldInv=new THREE.Quaternion();
const _wd=new THREE.Quaternion(), _ld=new THREE.Quaternion();

const ARMS=['LeftArm','LeftForeArm','RightArm','RightForeArm'];
const CHILD={ LeftArm:'LeftForeArm', LeftForeArm:'LeftHand', RightArm:'RightForeArm', RightForeArm:'RightHand' };
let armBones={}, restLocalQ={}, restWorldQ={}, restChildDirW={};
const _q1=new THREE.Quaternion(),_q2=new THREE.Quaternion(),_q3=new THREE.Quaternion(),_q4=new THREE.Quaternion(),_q5=new THREE.Quaternion();
const _v1=new THREE.Vector3(),_v2=new THREE.Vector3();

function initThree(){
  const canvas=$("avatarCanvas");
  renderer=new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false, preserveDrawingBuffer:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2)); renderer.setSize(canvas.width,canvas.height,false);
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
  scene=new THREE.Scene(); scene.background=new THREE.Color(0x0f1216);
  const pmrem=new THREE.PMREMGenerator(renderer);
  scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
  camera=new THREE.PerspectiveCamera(26, canvas.width/canvas.height, 0.1, 100); camera.position.set(0,0,3);
  scene.add(Object.assign(new THREE.DirectionalLight(0xfff4e6,1.6),{position:new THREE.Vector3(1.2,1.8,2.4)}));
  scene.add(Object.assign(new THREE.DirectionalLight(0xdfe8ff,0.5),{position:new THREE.Vector3(-2,0.6,1.4)}));
  scene.add(Object.assign(new THREE.DirectionalLight(0xffffff,0.7),{position:new THREE.Vector3(-0.5,1.5,-2.5)}));
  scene.add(new THREE.AmbientLight(0xffffff,0.25));
}

async function loadAvatar(url){
  if(avatarRoot){ scene.remove(avatarRoot); avatarRoot=null; }
  const ktx2=new KTX2Loader().setTranscoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/basis/').detectSupport(renderer);
  const loader=new GLTFLoader().setKTX2Loader(ktx2).setMeshoptDecoder(MeshoptDecoder);
  const gltf=await loader.loadAsync(url);
  scene.add(gltf.scene); avatarRoot=gltf.scene; morphMeshes=[]; headBone=null; armBones={}; restLocalQ={}; restWorldQ={}; restChildDirW={};
  gltf.scene.updateMatrixWorld(true);
  const byName={}; gltf.scene.traverse(o=>{ if(o.isBone) byName[o.name]=o; });
  headBone = byName['Head'] || null;
  gltf.scene.traverse(o=>{ if(o.isMesh && o.morphTargetDictionary && o.morphTargetInfluences){
    const ci={}; for(const [k,idx] of Object.entries(o.morphTargetDictionary)) ci[canon(k)]=idx; o.userData.canonIndex=ci; morphMeshes.push(o); } });
  for(const n of ARMS){ const b=byName[n]; const c=byName[CHILD[n]]; if(!b||!c) continue;
    armBones[n]=b; restLocalQ[n]=b.quaternion.clone(); restWorldQ[n]=b.getWorldQuaternion(new THREE.Quaternion());
    const bp=b.getWorldPosition(new THREE.Vector3()), cp=c.getWorldPosition(new THREE.Vector3());
    restChildDirW[n]=cp.sub(bp).normalize();
  }
  if(headBone){
    headBone.updateWorldMatrix(true,false);
    headBone.getWorldQuaternion(headWorldRest);
    if(headBone.parent){ headBone.parent.getWorldQuaternion(headParentWorldInv); headParentWorldInv.invert(); } else headParentWorldInv.identity();
  }
  frameUpper();
}

function frameUpper(){
  if(!avatarRoot) return;
  avatarRoot.updateMatrixWorld(true);
  let head=null, hips=null;
  avatarRoot.traverse(o=>{ if(o.isBone){ if(/^Head$/i.test(o.name)) head=o; if(/^Hips$/i.test(o.name)) hips=o; } });
  const hp = head?head.getWorldPosition(new THREE.Vector3()):new THREE.Vector3(0,1.5,0);
  const hipP = hips?hips.getWorldPosition(new THREE.Vector3()):new THREE.Vector3(0,0.9,0);
  const center=hp.clone().lerp(hipP,0.42);
  const torso=Math.max(0.25, hp.y-hipP.y);
  const zoom=parseFloat($("frameZoom").value);
  const half=torso*0.95*zoom;
  const dist=half/Math.tan((camera.fov*Math.PI/180)/2);
  camera.position.set(center.x, center.y, center.z+dist);
  camera.near=Math.max(dist/100,0.01); camera.far=dist*100; camera.updateProjectionMatrix();
  camera.lookAt(center.x, center.y, center.z);
}

async function initFace(fileset){
  const opts={ baseOptions:{ modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task', delegate:'GPU' }, outputFaceBlendshapes:true, outputFacialTransformationMatrixes:true, runningMode:'VIDEO', numFaces:1 };
  try { faceLandmarker=await FaceLandmarker.createFromOptions(fileset,opts); }
  catch(e){ opts.baseOptions.delegate='CPU'; faceLandmarker=await FaceLandmarker.createFromOptions(fileset,opts); }
}
async function initPose(fileset){
  const opts={ baseOptions:{ modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task', delegate:'GPU' }, runningMode:'VIDEO', numPoses:1, outputSegmentationMasks:false };
  try { poseLandmarker=await PoseLandmarker.createFromOptions(fileset,opts); }
  catch(e){ opts.baseOptions.delegate='CPU'; poseLandmarker=await PoseLandmarker.createFromOptions(fileset,opts); }
}

function applyFace(res){
  if(res.faceBlendshapes && res.faceBlendshapes.length){
    faceCount++;
    const cats=res.faceBlendshapes[0].categories;
    for(const m of morphMeshes){ const ci=m.userData.canonIndex, inf=m.morphTargetInfluences;
      for(const c of cats){ if(c.categoryName==='_neutral') continue; const cn=canon(c.categoryName); const idx=ci[cn];
        if(idx!==undefined){ const g=GAIN[cn]; inf[idx]=g?Math.min(1,Math.max(0,c.score-FLOOR)*g):c.score; } } }
  }
  if(res.facialTransformationMatrixes && res.facialTransformationMatrixes.length){
    const m=new THREE.Matrix4().fromArray(res.facialTransformationMatrixes[0].data);
    const p=new THREE.Vector3(), s=new THREE.Vector3(), q=new THREE.Quaternion(); m.decompose(p,q,s);
    q.y*=-1; q.z*=-1; targetHeadWorld.copy(q);
  }
}

function aim(name, bone, targetDirW, gain, smooth){
  const q=_q1.setFromUnitVectors(_v1.copy(restChildDirW[name]), _v2.copy(targetDirW).normalize());
  const newWorld=_q2.copy(q).multiply(restWorldQ[name]);
  const parent=bone.parent; parent.updateWorldMatrix(true,false);
  const pInv=_q3.copy(parent.getWorldQuaternion(_q4)).invert();
  const local=_q5.copy(pInv).multiply(newWorld);
  const tgt=new THREE.Quaternion().copy(restLocalQ[name]).slerp(local, gain);
  bone.quaternion.slerp(tgt, smooth);
}
function applyPose(res){
  lastPose = res;
  const W = res.worldLandmarks && res.worldLandmarks[0];
  if(!W){ return; }
  poseCount++;
  const mir = $("mirror").checked ? -1 : 1;
  const fz  = $("flipZ").checked ? -1 : 1;
  const gain = parseFloat($("armGain").value);
  const smooth = parseFloat($("smooth").value);
  const V = (i)=> new THREE.Vector3(mir*W[i].x, -W[i].y, fz*-W[i].z);
  let map = { Left:[11,13,15], Right:[12,14,16] };
  if($("swapLR").checked) map = { Left:[12,14,16], Right:[11,13,15] };
  for(const side of ['Left','Right']){
    const [sI,eI,wI]=map[side];
    const A=armBones[side+'Arm'], F=armBones[side+'ForeArm'];
    if(!A) continue;
    const sh=V(sI), el=V(eI), wr=V(wI);
    aim(side+'Arm', A, el.clone().sub(sh), gain, smooth);
    A.updateWorldMatrix(true,true);
    if(F){ aim(side+'ForeArm', F, wr.clone().sub(el), gain, smooth); F.updateWorldMatrix(true,false); }
  }
}

// 自分ビューにスケルトンを描画（検出できているか一目で分かる）
const POSE_CONN=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24]];
function drawOverlay(){
  const cv=$("poseOverlay"), ctx=cv.getContext('2d'); ctx.clearRect(0,0,cv.width,cv.height);
  const lm = lastPose && lastPose.landmarks && lastPose.landmarks[0];
  if(!lm) return;
  const X=(p)=> (1-p.x)*cv.width;  // selfVideoは鏡表示なのでxを反転して合わせる
  const Y=(p)=> p.y*cv.height;
  ctx.lineWidth=3; ctx.strokeStyle='#39d98a'; ctx.fillStyle='#7cf7c0';
  for(const [a,b] of POSE_CONN){ if(lm[a]&&lm[b]){ ctx.beginPath(); ctx.moveTo(X(lm[a]),Y(lm[a])); ctx.lineTo(X(lm[b]),Y(lm[b])); ctx.stroke(); } }
  for(const i of [11,12,13,14,15,16]){ const p=lm[i]; if(p){ ctx.beginPath(); ctx.arc(X(p),Y(p),4,0,7); ctx.fill(); } }
}
function updateHud(){
  fpsN++; const now=performance.now(); if(now-fpsT>500){ fps=Math.round(fpsN*1000/(now-fpsT)); fpsN=0; fpsT=now; }
  const lm = lastPose && lastPose.landmarks && lastPose.landmarks[0];
  const det = lm ? "検出中 ✓" : "未検出 ✗（上半身を写す）";
  const vis = (i)=> lm&&lm[i] ? (lm[i].visibility!=null?lm[i].visibility.toFixed(2):'-') : '-';
  $("hud").textContent =
    `fps: ${fps}\n手の検出: ${det}\n右手首vis: ${vis(16)}  左手首vis: ${vis(15)}\n腕ボーン: ${Object.keys(armBones).length}/4  顔:${faceCount} 手:${poseCount}` +
    (lastPoseErr?`\n⚠ ${lastPoseErr}`:``);
}

function loop(){
  if(!running) return; requestAnimationFrame(loop);
  const v=$("selfVideo");
  if(v && v.readyState>=2 && v.currentTime!==lastVideoTime){
    lastVideoTime=v.currentTime; const ts=performance.now();
    if($("faceOn").checked && faceLandmarker){ try{ applyFace(faceLandmarker.detectForVideo(v,ts)); }catch(e){} }
    if($("poseOn").checked && poseLandmarker){ try{ applyPose(poseLandmarker.detectForVideo(v,ts+0.5)); lastPoseErr=""; }catch(e){ lastPoseErr=String(e.message||e); } }
  }
  if(headBone && $("faceOn").checked){ _wd.copy(targetHeadWorld).multiply(headWorldRest); _ld.copy(headParentWorldInv).multiply(_wd); headBone.quaternion.slerp(_ld,0.35); }
  drawOverlay(); updateHud();
  renderer.render(scene,camera);
}

let voice=null, previewAudio=null;
async function toggleVoice(){
  if(voice){ voice.stop(); voice=null; if(previewAudio){ previewAudio.pause(); previewAudio.srcObject=null; previewAudio=null; } $("voiceBtn").textContent="声を試す（要ヘッドホン）"; return; }
  try{
    const mic=await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true } });
    voice=new VoiceConverter(); const track=await voice.start(mic);
    const v=voiceOf($("charSelect").value); voice.setVoice(v.p, v.f);
    previewAudio=new Audio(); previewAudio.autoplay=true; previewAudio.srcObject=new MediaStream([track]); previewAudio.play().catch(()=>{});
    $("voiceBtn").textContent="声を止める";
    setStatus("声プレビュー中：マイクに話すと変換された声が聞こえます（ハウリング防止にヘッドホン推奨）。");
  }catch(e){ setStatus("マイクを取得できませんでした: "+e.message); }
}

async function start(){
  $("startBtn").disabled=true; setStatus("カメラとモデルを準備中…");
  // 1) カメラ（失敗したら中断）
  try{
    const stream=await navigator.mediaDevices.getUserMedia({ video:{ width:640, height:480 }, audio:false });
    const v=$("selfVideo"); v.srcObject=stream; await v.play().catch(()=>{});
  }catch(e){ banner("カメラ取得失敗: "+(e.message||e)); setStatus("カメラ取得失敗: "+(e.message||e)); $("startBtn").disabled=false; return; }
  // 2) アバター（失敗しても続行）
  try{ initThree(); setStatus("アバターを読み込み中…"); await loadAvatar(CHARACTERS[$("charSelect").value].avatar); }
  catch(e){ banner("アバター読込失敗: "+(e.message||e)); }
  // 3) 何があってもレンダリング開始（アバターが見える）
  running=true; loop(); $("voiceBtn").disabled=false;
  // 4) 顔・手のモデルを個別に読み込み（片方が失敗しても他は動く）
  setStatus("顔・手のモデルを読み込み中…（初回は数十秒かかることがあります）");
  let fileset=null;
  try{ fileset=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'); }
  catch(e){ banner("MediaPipe WASM読込失敗: "+(e.message||e)); }
  if(fileset){
    try{ await initFace(fileset); }catch(e){ banner("顔モデル失敗: "+(e.message||e)); }
    try{ await initPose(fileset); }catch(e){ banner("手モデル失敗: "+(e.message||e)); }
  }
  setStatus("動作中。手を動かして腕が動くか確認してください。緑スケルトンが出ない場合は上のエラー表示を確認してください。");
}

$("startBtn").addEventListener("click", start);
$("voiceBtn").addEventListener("click", toggleVoice);
$("charSelect").addEventListener("change", async ()=>{
  const id=$("charSelect").value; showVoiceInfo(id);
  if(voice){ const v=voiceOf(id); voice.setVoice(v.p,v.f); }
  if(running){ try{ await loadAvatar(CHARACTERS[id].avatar); }catch(e){} }
});
for(const id of ["frameZoom","armGain","smooth"]){
  const el=$(id), out=$(id+"V"); const upd=()=>{ out.textContent=parseFloat(el.value).toFixed(2); };
  el.addEventListener("input",()=>{ upd(); if(id==="frameZoom") frameUpper(); }); upd();
}
showVoiceInfo($("charSelect").value);
</script>
