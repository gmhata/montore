<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PeerMontore - 練習画面</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif; background: #f4f6f8; color: #263238; min-height: 100vh; }
  header { background: #4527a0; color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-wrap:wrap; }
  header h1 { font-size: 18px; font-weight: 600; }
  header .room { background: rgba(255,255,255,.2); border-radius: 6px; padding: 3px 12px; font-size: 14px; font-weight:700; }
  header .role { background: #ec4899; border-radius: 6px; padding: 3px 12px; font-size: 13px; }
  header .sp { margin-left:auto; font-size:13px; }
  header a { color:#fff; font-size:13px; text-decoration:none; opacity:.9; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  .panel { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 16px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  label { font-size: 14px; }
  select { padding: 7px 10px; border: 1px solid #b0bec5; border-radius: 6px; font-size: 15px; }
  button { padding: 10px 18px; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; background: #4527a0; color: #fff; }
  button:hover { filter: brightness(1.1); } button:disabled { background: #b0bec5; cursor: default; }
  button.secondary { background: #eceff1; color: #37474f; }
  button.big { font-size:16px; padding:14px 22px; }
  .rolepick { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:6px; }
  .rolecard { border:2px solid #d1c4e9; border-radius:12px; padding:20px; cursor:pointer; transition:.15s; background:#fff; }
  .rolecard:hover { border-color:#4527a0; box-shadow:0 4px 14px rgba(69,39,160,.15); transform:translateY(-2px); }
  .rolecard .t { font-size:17px; font-weight:700; color:#4527a0; margin-bottom:6px; }
  .rolecard .d { font-size:13px; color:#607d8b; line-height:1.6; }
  #status { font-size: 13px; color: #607d8b; margin-top: 10px; white-space: pre-wrap; }
  .note { font-size:13px; background:#ede7f6; border-radius:6px; padding:10px 14px; margin-top:12px; line-height:1.7; }
  .voicerow { margin-top:12px; }
  .videos { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
  .videobox { background: #000; border-radius: 10px; overflow: hidden; position: relative; aspect-ratio: 16/9; }
  .videobox video, .videobox canvas { width: 100%; height: 100%; object-fit: contain; background:#000; display:block; }
  .videobox .tag { position: absolute; left: 10px; top: 10px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; padding: 3px 10px; border-radius: 4px; z-index: 2; }
  .hidden { display: none !important; }
  /* v4.70 患者役専用ブロック */
  .patientonly { border:2px solid #f8bbd0; background:#fff5fa; border-radius:12px; padding:14px 16px; margin-top:14px; }
  .patientonly .po-title { font-weight:700; color:#c2185b; font-size:13px; margin-bottom:8px; }
  .patientonly .po-ue { font-size:13px; color:#6b2b52; margin-top:10px; }
</style>
</head>
<body>
<header>
  <h1>PeerMontore 練習</h1>
  <span class="room" id="roomLabel">ルーム—</span>
  <span class="role hidden" id="roleLabel"></span>
  <span class="sp" id="userinfo"></span>
  <a href="/peer.html">← ロビー</a>
</header>
<main>
  <!-- ログイン待ち -->
  <div class="panel" id="loginPanel">
    <div id="loginMsg">ログイン状態を確認中...</div>
  </div>

  <!-- 役割選択  v4.70: UI整理・患者役設定をグルーピング -->
  <div class="panel hidden" id="rolePanel">
    <div class="row" style="justify-content:space-between;">
      <div><b>役割を選んでください</b></div>
    </div>
    <div class="row voicerow">
      <label>カメラ: <select id="cameraSelect"><option value="">既定のカメラ</option></select></label>
      <button id="camRefreshBtn" class="secondary" type="button">カメラ一覧を更新</button>
    </div>
    <div class="rolepick">
      <div class="rolecard" id="pickNurse">
        <div class="t">看護師役で開始</div>
        <div class="d">実写のカメラ・声で参加します。</div>
      </div>
      <div class="rolecard" id="pickPatient">
        <div class="t">患者役で開始</div>
        <div class="d">Webカメラの表情がアバターに反映されます。</div>
      </div>
    </div>
    <div class="patientonly" id="patientSettings">
      <div class="po-title">🩺 患者役の設定（看護師役では不要）</div>
      <div class="voicerow row" id="voiceControls">
      <label>患者の声(ペルソナ):
        <select id="personaSelect">
          <option value="none">なし(原声)</option>
          <option value="kd">高齢男性</option><option value="cd">中年男性</option><option value="jd">若年男性</option>
          <option value="kj">高齢女性</option><option value="cj">中年女性</option><option value="jj">若年女性</option>
        </select>
      </label>
      <label style="display:flex;align-items:center;gap:6px;">高さ<input type="range" id="pitchRange" min="-12" max="12" step="1" value="0" style="width:120px;"><span id="pitchVal" style="font-size:12px;width:60px;">0 半音</span></label>
      <label style="display:flex;align-items:center;gap:6px;">太さ<input type="range" id="formantRange" min="0.70" max="1.40" step="0.01" value="1.00" style="width:120px;"><span id="formantVal" style="font-size:12px;width:48px;">100%</span></label>
      
    </div>
    <div class="po-ue">UE版（先生のデモ用・写真級）: <a id="ueLink" href="#">こちら</a></div>
    </div>
    <div id="status2" style="font-size:13px;color:#607d8b;margin-top:10px;"></div>
  </div>

  <!-- 通話中 -->
  <div class="panel hidden" id="callPanel">
    <div class="row" style="justify-content:space-between;">
      <div id="status">接続中...</div>
      <div class="row">
        <button id="swapBtn" class="secondary">役割を交代</button>
        <button id="leaveBtn" class="secondary">退室（ロビーへ）</button>
      </div>
    </div>
  </div>

  <div class="videos hidden" id="videosWrap">
    <div class="videobox"><span class="tag">相手</span><video id="remoteVideo" autoplay playsinline></video></div>
    <div class="videobox">
      <span class="tag" id="localTag">自分</span>
      <video id="localVideo" class="hidden" autoplay playsinline muted></video>
      <canvas id="avatarCanvas" class="hidden" width="640" height="360"></canvas>
    </div>
  </div>
  <video id="camVideo" class="hidden" autoplay playsinline muted></video>
</main>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script src="/firebase-config.js"></script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { FaceLandmarker, PoseLandmarker, HandLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getAuth, onAuthStateChanged, getIdToken } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
import { VoiceConverter, PERSONAS } from '/peer-voice.js';

const $ = (id) => document.getElementById(id);
const setStatus = (m) => { $("status").textContent = m; };
const setStatus2 = (m) => { $("status2").textContent = m; };

// ルーム(生の名前 renshuN)
const roomRaw = (new URLSearchParams(location.search).get("room") || "renshu1").trim();
const roomNum = (roomRaw.match(/(\d+)/) || [,"?"])[1];
$("roomLabel").textContent = "ルーム" + roomNum;
$("ueLink").href = "/peer-patient.html?room=" + encodeURIComponent(roomRaw);

const app = initializeApp(window.FIREBASE_CONFIG);
const auth = getAuth(app);

let ROLE = null, joined = false;
let lkRoom = null, localTracks = [], camStream = null, canvasStream = null;

// ===== アバター(患者役) =====
function canon(s){ return String(s).toLowerCase().replace(/left$/,'l').replace(/right$/,'r').replace(/[^a-z0-9]/g,''); }
const FLOOR = 0.03;
const GAIN = {};
(function(){ const set=(n,g)=>{GAIN[canon(n)]=g;};
  [['eyeBlinkLeft',3.2],['eyeBlinkRight',3.2],['eyeLookInLeft',2.6],['eyeLookOutLeft',2.6],['eyeLookUpLeft',2.6],['eyeLookDownLeft',2.6],
   ['eyeLookInRight',2.6],['eyeLookOutRight',2.6],['eyeLookUpRight',2.6],['eyeLookDownRight',2.6],
   ['eyeSquintLeft',2.4],['eyeSquintRight',2.4],['eyeWideLeft',2.4],['eyeWideRight',2.4],
   ['cheekPuff',4.5],['cheekSquintLeft',2.6],['cheekSquintRight',2.6]].forEach(([n,g])=>set(n,g)); })();

let renderer, scene, camera, morphMeshes = [], headNode = null, headBone = null, faceLandmarker = null, avatarRunning = false, lastVideoTime = -1;
const APPLY_HEAD_POSE = true;   // 首の向き・傾きをHeadボーンに反映
const HEAD_POSE_GAIN = 1.0;     // 首振りの強さ(1.0=等倍)
const targetHeadWorld = new THREE.Quaternion();
const headWorldRest = new THREE.Quaternion();
const headParentWorldInv = new THREE.Quaternion();
const _wd = new THREE.Quaternion(), _ld = new THREE.Quaternion();

function initThree(){
  const canvas = $("avatarCanvas");
  renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false, preserveDrawingBuffer:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2)); renderer.setSize(canvas.width, canvas.height, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x0f1216);
  // PBR環境光(内蔵RoomEnvironment, 外部アセット不要) — 肌の反射/質感が上がる
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  camera = new THREE.PerspectiveCamera(24, canvas.width/canvas.height, 0.1, 100); camera.position.set(0,0,3);
  const key=new THREE.DirectionalLight(0xfff4e6,1.6); key.position.set(1.2,1.8,2.4); scene.add(key);
  const fill=new THREE.DirectionalLight(0xdfe8ff,0.5); fill.position.set(-2,0.6,1.4); scene.add(fill);
  const rim=new THREE.DirectionalLight(0xffffff,0.7); rim.position.set(-0.5,1.5,-2.5); scene.add(rim);
  scene.add(new THREE.AmbientLight(0xffffff,0.25));
}
// 上半身フレーミング(頭〜腰)。手のしぐさが相手に見えるよう引きめ。
const UP_ZOOM = 1.28;
function frameUpper(rootObj){
  rootObj.updateMatrixWorld(true);
  let head=null, hips=null;
  rootObj.traverse(o=>{ if(o.isBone){ if(/^Head$/i.test(o.name)) head=o; if(/^Hips$/i.test(o.name)) hips=o; } });
  const hp = head?head.getWorldPosition(new THREE.Vector3()):new THREE.Vector3(0,1.5,0);
  const hipP = hips?hips.getWorldPosition(new THREE.Vector3()):new THREE.Vector3(0,0.9,0);
  const torso=Math.max(0.3, hp.y-hipP.y);
  const center=hp.clone(); center.y += torso*0.10; // 狙いを頭より上に=頭を下げ余白
  const half=torso*0.30*UP_ZOOM; const dist=half/Math.tan((camera.fov*Math.PI/180)/2);
  camera.position.set(center.x, center.y, center.z+dist);
  camera.near=Math.max(dist/100,0.01); camera.far=dist*100; camera.updateProjectionMatrix();
  camera.lookAt(center.x, center.y, center.z);
}
// ===== ペルソナ→リアルアバター(自ホスト同一オリジンGLB) =====
// ★同一オリジン配信でCORS/外部ホスト遮断(学内NW等)を回避。暫定は全ペルソナ共通の1体(最終は男女・年齢別に差替)。
// モデル: Ready Player Me製 "brunette" (ARKitブレンドシェイプ, CC BY-NC 4.0, 出典 met4citizen/TalkingHead) — 学内教育(非商用)用途。
const DEFAULT_AVATAR = "/avatar-f-brunette.glb";
const PERSONA_AVATAR = { none:DEFAULT_AVATAR, kd:DEFAULT_AVATAR, cd:DEFAULT_AVATAR, jd:DEFAULT_AVATAR, kj:DEFAULT_AVATAR, cj:DEFAULT_AVATAR, jj:DEFAULT_AVATAR };
function avatarUrlFor(p){ return PERSONA_AVATAR[p] || DEFAULT_AVATAR; }
async function loadAvatar(url){
  const ktx2=new KTX2Loader().setTranscoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/basis/').detectSupport(renderer);
  const loader=new GLTFLoader().setKTX2Loader(ktx2).setMeshoptDecoder(MeshoptDecoder);
  const gltf=await loader.loadAsync(url);
  scene.add(gltf.scene); headNode=gltf.scene; morphMeshes=[]; headBone=null;
  gltf.scene.traverse(o=>{ if(o.isBone && /^Head$/i.test(o.name)) headBone=o; });
  gltf.scene.traverse(o=>{ if(o.isMesh && o.morphTargetDictionary && o.morphTargetInfluences){
    const ci={}; for(const [k,idx] of Object.entries(o.morphTargetDictionary)) ci[canon(k)]=idx; o.userData.canonIndex=ci; morphMeshes.push(o); } });
  frameUpper(gltf.scene);
  captureRig(gltf.scene);
  // 首振り用: Headボーンの静止ワールド姿勢と親の逆姿勢を記録
  if(headBone){
    headBone.updateWorldMatrix(true,false);
    headBone.getWorldQuaternion(headWorldRest);
    if(headBone.parent){ headBone.parent.getWorldQuaternion(headParentWorldInv); headParentWorldInv.invert(); }
    else headParentWorldInv.identity();
  }
}
async function initFace(){
  const fileset=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  const opts={ baseOptions:{ modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task', delegate:'GPU' }, outputFaceBlendshapes:true, outputFacialTransformationMatrixes:true, runningMode:'VIDEO', numFaces:1 };
  try { faceLandmarker=await FaceLandmarker.createFromOptions(fileset, opts); }
  catch(e){ opts.baseOptions.delegate='CPU'; faceLandmarker=await FaceLandmarker.createFromOptions(fileset, opts); }
  try { await initPose(fileset); } catch(e){}
  try { await initHands(fileset); } catch(e){}
}
function applyResults(res){
  if(res.faceBlendshapes && res.faceBlendshapes.length){
    const cats=res.faceBlendshapes[0].categories;
    for(const m of morphMeshes){ const ci=m.userData.canonIndex, inf=m.morphTargetInfluences;
      for(const c of cats){ if(c.categoryName==='_neutral') continue; const cn=canon(c.categoryName); const idx=ci[cn];
        if(idx!==undefined){ const g=GAIN[cn]; inf[idx]=g?Math.min(1,Math.max(0,c.score-FLOOR)*g):c.score; } } }
  }
  if(res.facialTransformationMatrixes && res.facialTransformationMatrixes.length){
    const m=new THREE.Matrix4().fromArray(res.facialTransformationMatrixes[0].data);
    const p=new THREE.Vector3(), s=new THREE.Vector3(), q=new THREE.Quaternion(); m.decompose(p,q,s);
    const eu=new THREE.Euler().setFromQuaternion(q,'YXZ'); eu.y*=-1; targetHeadWorld.setFromEuler(eu);
  }
}
// ===== 手・腕・指トラッキング(MediaPipe) : avatar-lab確定方式を移植 =====
let poseLandmarker=null, handLandmarker=null;
const ARM_EMA=0.06, ARM_SLERP=0.5;                                    // 確定: なめらかさ0.12・腕入替OFF
const FINGER_AXIS='x', FINGER_SIGN=1, FINGER_GAIN=1.1, THUMB_HOLD=true; // 確定: 指軸X・向き+・親指固定
const FSPEC=[ ['Thumb',[1,2,3],[0.5,1.1,0.9],'thumb'], ['Index',[1,2,3],[1.7,1.7,1.3],'index'], ['Middle',[1,2,3],[1.7,1.7,1.3],'middle'], ['Ring',[1,2,3],[1.7,1.7,1.3],'ring'], ['Pinky',[1,2,3],[1.6,1.6,1.2],'little'] ];
const ARM={}; let boneAxis={}, armDefaults={}, armEMA={};
let fingerBones={}, fingerDefaults={}, fingerQ={}, thumbFlexAxis={};
const _q1=new THREE.Quaternion(),_q2=new THREE.Quaternion();
const _av2=new THREE.Vector3();
async function initPose(fileset){ const o={ baseOptions:{ modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task', delegate:'GPU' }, runningMode:'VIDEO', numPoses:1 }; try{ poseLandmarker=await PoseLandmarker.createFromOptions(fileset,o); }catch(e){ o.baseOptions.delegate='CPU'; poseLandmarker=await PoseLandmarker.createFromOptions(fileset,o); } }
async function initHands(fileset){ const o={ baseOptions:{ modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate:'GPU' }, runningMode:'VIDEO', numHands:2 }; try{ handLandmarker=await HandLandmarker.createFromOptions(fileset,o); }catch(e){ o.baseOptions.delegate='CPU'; handLandmarker=await HandLandmarker.createFromOptions(fileset,o); } }
function captureRig(rootObj){
  const byName={}; rootObj.traverse(o=>{ if(o.isBone) byName[o.name]=o; });
  ARM.leftUpperArm=byName['LeftArm']; ARM.leftLowerArm=byName['LeftForeArm']; ARM.leftHand=byName['LeftHand'];
  ARM.rightUpperArm=byName['RightArm']; ARM.rightLowerArm=byName['RightForeArm']; ARM.rightHand=byName['RightHand'];
  const dc=(child,fb)=>{ if(!child) return fb.clone(); const d=child.position.clone(); return d.lengthSq()<1e-10?fb.clone():d.normalize(); };
  const FX=new THREE.Vector3(1,0,0), NX=new THREE.Vector3(-1,0,0);
  boneAxis={ leftUpperArm:dc(ARM.leftLowerArm,FX), rightUpperArm:dc(ARM.rightLowerArm,NX), leftLowerArm:dc(ARM.leftHand,FX), rightLowerArm:dc(ARM.rightHand,NX) };
  armDefaults={}; armEMA={}; for(const k of ['leftUpperArm','leftLowerArm','rightUpperArm','rightLowerArm']){ const b=ARM[k]; if(b) armDefaults[k]=b.quaternion.clone(); }
  fingerBones={}; fingerDefaults={}; fingerQ={}; thumbFlexAxis={};
  for(const side of ['Left','Right']) for(const sp of FSPEC) for(const j of sp[1]){ const b=byName[side+'Hand'+sp[0]+j]; if(b){ fingerBones[side+sp[0]+j]=b; fingerDefaults[side+sp[0]+j]={x:b.rotation.x,y:b.rotation.y,z:b.rotation.z}; fingerQ[side+sp[0]+j]=b.quaternion.clone(); } }
  for(const side of ['Left','Right']){ const w=byName[side+'Hand'], iM=byName[side+'HandIndex1'], pM=byName[side+'HandPinky1']; let pnW=null;
    if(w&&iM&&pM){ const wp=w.getWorldPosition(new THREE.Vector3()), ip=iM.getWorldPosition(new THREE.Vector3()), pp=pM.getWorldPosition(new THREE.Vector3()); pnW=new THREE.Vector3().crossVectors(ip.clone().sub(wp), pp.clone().sub(wp)); if(pnW.lengthSq()>1e-10) pnW.normalize(); else pnW=null; }
    for(const j of [1,2,3]){ const b=byName[side+'HandThumb'+j], c=byName[side+'HandThumb'+(j+1)]; if(!b||!c) continue; const ll=c.position.clone(); if(ll.lengthSq()<1e-10) continue; ll.normalize(); let ax=new THREE.Vector3(0,0,1); if(pnW){ b.updateWorldMatrix(true,false); const inv=b.getWorldQuaternion(new THREE.Quaternion()).invert(); const pnL=pnW.clone().applyQuaternion(inv).normalize(); const cr=new THREE.Vector3().crossVectors(ll,pnL); if(cr.lengthSq()>1e-8) ax=cr.normalize(); } thumbFlexAxis[side+'Thumb'+j]=ax; } }
}
const _KNEE=0.25,_CAP=0.40;
function shapeWorldDir(v){ if(v.z<0){ v.z=0; return v; } let z=v.z; if(z>_KNEE){ const over=z-_KNEE,range=_CAP-_KNEE; z=_KNEE+range*(1-1/(1+over/range)); } v.z=z; return v; }
function poseDirToWorld(from,to,out){ out.set(to.x-from.x, -(to.y-from.y), -(to.z-from.z)); return out; }
function aimBone(bone,defDir,worldDir,smooth){ if(!bone||!bone.parent) return; const len=worldDir.length(); if(len<1e-5) return; bone.parent.updateWorldMatrix(true,false); bone.parent.getWorldQuaternion(_q1); _q1.invert(); _av2.copy(worldDir).divideScalar(len).applyQuaternion(_q1); _q2.setFromUnitVectors(defDir,_av2); bone.quaternion.slerp(_q2,smooth); }
function emaP(key,p,a){ let s=armEMA[key]; if(!s){ armEMA[key]={x:p.x,y:p.y,z:p.z}; return armEMA[key]; } s.x+=(p.x-s.x)*a; s.y+=(p.y-s.y)*a; s.z+=(p.z-s.z)*a; return s; }
function applyArms(res){
  const L=res.landmarks&&res.landmarks[0]; if(!L) return;
  const map={left:[11,13,15],right:[12,14,16]};
  for(const side of ['left','right']){
    const sI=map[side][0],eI=map[side][1],wI=map[side][2]; const up=ARM[side+'UpperArm'], lo=ARM[side+'LowerArm']; if(!up||!lo) continue;
    if((L[sI].visibility==null?1:L[sI].visibility)<0.3){ if(armDefaults[side+'UpperArm']) up.quaternion.slerp(armDefaults[side+'UpperArm'],0.1); if(armDefaults[side+'LowerArm']) lo.quaternion.slerp(armDefaults[side+'LowerArm'],0.1); continue; }
    const sh=emaP(side+'s',L[sI],ARM_EMA), el=emaP(side+'e',L[eI],ARM_EMA), wr=emaP(side+'w',L[wI],ARM_EMA);
    aimBone(up, boneAxis[side+'UpperArm'], shapeWorldDir(poseDirToWorld(sh,el,new THREE.Vector3())), ARM_SLERP); up.updateWorldMatrix(true,true);
    aimBone(lo, boneAxis[side+'LowerArm'], shapeWorldDir(poseDirToWorld(el,wr,new THREE.Vector3())), ARM_SLERP); lo.updateWorldMatrix(true,false);
  }
}
function computeFingerState(pts){ if(!pts||pts.length<21) return null; const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y); const curl=(m,pp,dp,t)=>{ const ext=d(pts[m],pts[pp])+d(pts[pp],pts[dp])+d(pts[dp],pts[t]); return Math.max(0,Math.min(1,(1-d(pts[m],pts[t])/Math.max(ext*0.8,0.001))*3.0)); }; return { index:curl(5,6,7,8), middle:curl(9,10,11,12), ring:curl(13,14,15,16), little:curl(17,18,19,20) }; }
function applyFingerCurl(Side,state){
  const defAxis=FINGER_AXIS==='x'?'x':'z';
  for(const sp of FSPEC){ const f=sp[0],joints=sp[1],weights=sp[2],key=sp[3];
    if(f==='Thumb'){ if(THUMB_HOLD){ for(const j of joints){ const b=fingerBones[Side+f+j], rq=fingerQ[Side+f+j]; if(b&&rq) b.quaternion.slerp(rq,0.3); } } continue; }
    const axisKey=defAxis, others=axisKey==='x'?['y','z']:['x','y']; const cv=state?state[key]:0;
    for(let ji=0;ji<joints.length;ji++){ const j=joints[ji]; const b=fingerBones[Side+f+j], def=fingerDefaults[Side+f+j]; if(!b||!def) continue;
      const tgt=def[axisKey]+FINGER_SIGN*(cv||0)*weights[ji]*FINGER_GAIN; b.rotation[axisKey]+=(tgt-b.rotation[axisKey])*0.3;
      for(const k of others) b.rotation[k]+=(def[k]-b.rotation[k])*0.3; }
  }
}
function applyHands(res){
  const L=res.landmarks; if(!L||!L.length) return;
  if(L.length>=2){ const arr=L.map(pp=>({pp,x:pp[0].x})).sort((a,b)=>a.x-b.x);
    applyFingerCurl('Right', computeFingerState(arr[0].pp));   // 画像左(低x)=本人右→アバター右
    applyFingerCurl('Left',  computeFingerState(arr[1].pp)); } // 画像右(高x)=本人左→アバター左
  else { const hd=res.handednesses||res.handedness; const lbl=(hd&&hd[0]&&hd[0][0])?hd[0][0].categoryName:'Right'; applyFingerCurl(lbl==='Left'?'Left':'Right', computeFingerState(L[0])); }
}
function avatarLoop(){
  if(!avatarRunning) return; requestAnimationFrame(avatarLoop);
  const v=$("camVideo");
  if(v && v.readyState>=2 && v.currentTime!==lastVideoTime){ lastVideoTime=v.currentTime; const _ts=performance.now();
    if(faceLandmarker){ try{ applyResults(faceLandmarker.detectForVideo(v, _ts)); }catch(e){} }
    if(poseLandmarker){ try{ applyArms(poseLandmarker.detectForVideo(v, _ts+0.3)); }catch(e){} }
    if(handLandmarker){ try{ applyHands(handLandmarker.detectForVideo(v, _ts+0.6)); }catch(e){} }
  }
  if(APPLY_HEAD_POSE && headBone){ _wd.copy(targetHeadWorld).multiply(headWorldRest); _ld.copy(headParentWorldInv).multiply(_wd); headBone.quaternion.slerp(_ld, 0.35); }
  renderer.render(scene, camera);
}

// ===== 声変換(患者役) =====
const voice = new VoiceConverter();
function applyVoice(){
  const semi=Number($("pitchRange").value), ft=Number($("formantRange").value);
  $("pitchVal").textContent=(semi>0?"+":"")+semi+" 半音"; $("formantVal").textContent=Math.round(ft*100)+"%";
  voice.setVoice(semi, ft);
}
function presetFromPersona(){ const pre=PERSONAS[$("personaSelect").value]||PERSONAS.none; $("pitchRange").value=pre.p; $("formantRange").value=pre.f; applyVoice(); }
$("personaSelect").addEventListener("change", presetFromPersona);
$("pitchRange").addEventListener("input", applyVoice);
$("formantRange").addEventListener("input", applyVoice);

// ===== カメラ選択 =====
async function listCameras(){
  try{ const devs=await navigator.mediaDevices.enumerateDevices(); const cams=devs.filter(d=>d.kind==="videoinput");
    const sel=$("cameraSelect"); const cur=sel.value;
    sel.innerHTML='<option value="">既定のカメラ</option>'+cams.map((c,i)=>`<option value="${c.deviceId}">${c.label||("カメラ"+(i+1))}</option>`).join("");
    if(cur) sel.value=cur; }catch(e){}
}
async function setupCameras(){ try{ const tmp=await navigator.mediaDevices.getUserMedia({video:true}); tmp.getTracks().forEach(t=>t.stop()); }catch(e){} await listCameras(); }
$("camRefreshBtn").addEventListener("click", setupCameras);
if(navigator.mediaDevices && navigator.mediaDevices.addEventListener) navigator.mediaDevices.addEventListener("devicechange", listCameras);

// ===== 認証・トークン =====
async function fetchToken(room, role){
  const idToken=await getIdToken(auth.currentUser,true);
  const r=await fetch("/api/peer/token",{ method:"POST", headers:{ "Content-Type":"application/json","Authorization":"Bearer "+idToken }, body:JSON.stringify({room, role}) });
  const data=await r.json(); if(!r.ok) throw new Error(data.error||("HTTP "+r.status)); return data;
}
function attachRemoteTrack(track){
  if(track.kind==="video") track.attach($("remoteVideo"));
  else if(track.kind==="audio"){ const el=track.attach(); el.id="remoteAudio"; document.body.appendChild(el); }
}

// ===== 在室ハートビート =====
let hbTimer=null;
async function peerHeartbeat(){ if(!joined || !ROLE || !auth.currentUser) return;
  try{ const idToken=await getIdToken(auth.currentUser); await fetch("/api/peer/heartbeat",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+idToken},body:JSON.stringify({room:roomRaw,role:ROLE})}); }catch(e){} }
function startHeartbeat(){ peerHeartbeat(); if(!hbTimer) hbTimer=setInterval(peerHeartbeat,5000); }
async function stopHeartbeat(){ if(hbTimer){clearInterval(hbTimer);hbTimer=null;} if(auth.currentUser){ try{ const idToken=await getIdToken(auth.currentUser); await fetch("/api/peer/leave",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+idToken},body:JSON.stringify({room:roomRaw}),keepalive:true}); }catch(e){} } }
window.addEventListener("pagehide", ()=>{ stopHeartbeat(); });

// ===== 画面制御 =====
function showRoleSelection(){
  $("rolePanel").classList.remove("hidden");
  $("callPanel").classList.add("hidden");
  $("videosWrap").classList.add("hidden");
  $("roleLabel").classList.add("hidden");
}
function showCall(role){
  $("rolePanel").classList.add("hidden");
  $("callPanel").classList.remove("hidden");
  $("videosWrap").classList.remove("hidden");
  $("roleLabel").classList.remove("hidden");
  $("roleLabel").textContent = role==="nurse" ? "看護師役" : "患者役(Web)";
  $("localTag").textContent = role==="nurse" ? "自分(看護師役)" : "送信中のアバター";
  $("localVideo").classList.toggle("hidden", role!=="nurse");
  $("avatarCanvas").classList.toggle("hidden", role!=="patient");
}

// ===== 役割開始 =====
async function startRole(role){
  ROLE = role;
  $("pickNurse").style.pointerEvents="none"; $("pickPatient").style.pointerEvents="none";
  try{
    setStatus2("カメラ・マイクを取得中...");
    const camId=$("cameraSelect").value;
    const vc = role==="nurse" ? {width:{ideal:1280},height:{ideal:720}} : {width:{ideal:640},height:{ideal:480}};
    if(camId) vc.deviceId={exact:camId}; else vc.facingMode='user';
    let audioTrack=null, videoTrack=null, receiveOnly=false;
    try{
      camStream=await navigator.mediaDevices.getUserMedia({ video:vc, audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:false} });
    }catch(eCam){
      // カメラ不可: 看護師は音声のみ、患者はアバター出せないのでエラー
      if(role==="nurse"){ try{ camStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); }catch(eAud){ camStream=null; receiveOnly=true; } }
      else throw eCam;
    }
    listCameras();

    if(role==="patient"){
      $("camVideo").srcObject=new MediaStream(camStream.getVideoTracks()); await $("camVideo").play();
      setStatus2("リアルアバターと表情認識を準備中...(初回は少し時間がかかります)");
      const avUrl = avatarUrlFor($("personaSelect").value);
      initThree(); await loadAvatar(avUrl); await initFace(); avatarRunning=true; avatarLoop();
      const micStream=new MediaStream(camStream.getAudioTracks());
      audioTrack=await voice.start(micStream); applyVoice();
      canvasStream=$("avatarCanvas").captureStream(30); videoTrack=canvasStream.getVideoTracks()[0];
    } else {
      const vids = camStream ? camStream.getVideoTracks() : [];
      const auds = camStream ? camStream.getAudioTracks() : [];
      videoTrack = vids[0] || null; audioTrack = auds[0] || null;
      $("localVideo").srcObject = videoTrack ? new MediaStream([videoTrack]) : null;
    }
    localTracks=[videoTrack, audioTrack].filter(Boolean);

    setStatus2("通話サーバへ接続中...");
    const { url, token }=await fetchToken(roomRaw, role);
    lkRoom=new LivekitClient.Room({ adaptiveStream:true, dynacast:true });
    lkRoom.on(LivekitClient.RoomEvent.TrackSubscribed,(t)=>attachRemoteTrack(t));
    lkRoom.on(LivekitClient.RoomEvent.ParticipantConnected,(p)=>setStatus("相手が入室しました: "+(p.name||p.identity)));
    lkRoom.on(LivekitClient.RoomEvent.ParticipantDisconnected,()=>setStatus("相手が退室しました。"));
    lkRoom.on(LivekitClient.RoomEvent.Disconnected,()=>setStatus("切断されました。"));
    await lkRoom.connect(url, token);
    for(const t of localTracks){ await lkRoom.localParticipant.publishTrack(t, t.kind==="video"?{ videoCodec:"vp9", videoEncoding:{ maxBitrate:1_800_000, maxFramerate:30 } }:undefined); }

    joined=true;
    showCall(role);
    // 声設定は役割選択時のみ。通話中は表示しない(役割選択パネルにそのまま置く)。
    startHeartbeat();
    const others=lkRoom.remoteParticipants?lkRoom.remoteParticipants.size:0;
    const note = receiveOnly ? "(受信専用)" : "";
    setStatus("入室しました"+note+"。"+(others?"相手は入室済みです。":"相手の入室を待っています..."));
  }catch(e){
    console.error(e);
    setStatus2("エラー: "+(e&&e.message?e.message:e));
    ROLE=null; $("pickNurse").style.pointerEvents=""; $("pickPatient").style.pointerEvents="";
  }
}

// ===== 退室/交代 =====
async function teardown(){
  await stopHeartbeat();
  try{ if(lkRoom) await lkRoom.disconnect(); }catch(e){}
  lkRoom=null;
  avatarRunning=false;
  try{ voice.stop(); }catch(e){}
  localTracks.forEach(t=>t.stop()); localTracks=[];
  if(canvasStream){ canvasStream.getTracks().forEach(t=>t.stop()); canvasStream=null; }
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  $("camVideo").srcObject=null; $("localVideo").srcObject=null;
  const ra=$("remoteAudio"); if(ra) ra.remove();
  joined=false; ROLE=null;
  $("pickNurse").style.pointerEvents=""; $("pickPatient").style.pointerEvents="";
}
$("swapBtn").addEventListener("click", async ()=>{ await teardown(); showRoleSelection(); setStatus2("役割を選び直してください（同じルームのままです）。"); });
$("leaveBtn").addEventListener("click", async ()=>{ await teardown(); location.href="/peer.html"; });

$("pickNurse").addEventListener("click", ()=> startRole("nurse"));
$("pickPatient").addEventListener("click", ()=> startRole("patient"));

// ===== 起動 =====
onAuthStateChanged(auth, (user)=>{
  if(user){
    $("userinfo").textContent=user.email||"";
    $("loginPanel").classList.add("hidden");
    showRoleSelection();
    setupCameras();
  } else {
    $("loginPanel").classList.remove("hidden");
    $("loginMsg").innerHTML = 'montoreにログインが必要です。<a href="/index.html">メニューからログイン</a>してから、ロビー経由で開いてください。';
    $("rolePanel").classList.add("hidden");
  }
});
</script>
