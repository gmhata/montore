<title>PeerMontore - 練習画面</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  button:hover { filter: brightness(1.08); } button:disabled { background: #b0bec5; cursor: default; }
  .rolepick { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:14px; }
  .rolebtn { padding:22px 12px; font-size:18px; font-weight:700; border-radius:12px; background:#fff; color:#be185d; border:2px solid #f5c6e0; cursor:pointer; }
  .rolebtn:hover { border-color:#ec4899; box-shadow:0 4px 14px rgba(236,72,153,.18); }
  .uerow { font-size:13px; color:#6b2b52; margin-top:16px; }
  #status2 { font-size:13px; color:#607d8b; margin-top:12px; white-space:pre-wrap; }

  .sidebar { width:300px; flex:0 0 300px; background:#e6e8eb; padding:16px; display:flex; flex-direction:column; gap:12px; overflow-y:auto; }
  .stage { flex:1 1 auto; background:#fff; position:relative; display:flex; align-items:center; justify-content:center; min-width:0; }
  .stage video { width:100%; height:100%; object-fit:contain; background:#fff; display:block; }

  .btnrow { display:flex; gap:8px; }
  .btnrow .b { flex:1; border-radius:10px; padding:12px 6px; font-size:15px; font-weight:700; cursor:pointer; }
  .b-primary { background:#e5399b; color:#fff; border:none; }
  .b-primary:hover { filter:brightness(1.08); }
  .b-secondary { background:#fff; color:#c2185b; border:2px solid #f48fb1; }
  .b-secondary:hover { background:#fff0f6; }
  .sblabel { font-size:13px; color:#455a64; margin-top:2px; }
  .sbbox { width:100%; aspect-ratio:16/9; background:#0f1216; border-radius:8px; overflow:hidden; flex:0 0 auto; }
  .sbbox.avatar { aspect-ratio:4/3; } /* 送信映像(アバター)は高さを広げて大きく表示=送信エリアをそのまま映す */
  .sbbox video, .sbbox canvas { width:100%; height:100%; object-fit:cover; background:#0f1216; display:block; }

  .patientonly { border:2px solid #f8bbd0; background:#fff5fa; border-radius:10px; padding:12px; }
  .patientonly .po-title { font-weight:700; color:#c2185b; font-size:12px; margin-bottom:8px; }
  .patientonly label { font-size:12px; }
  .hidden { display: none !important; }
</style>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { FaceLandmarker, PoseLandmarker, HandLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getAuth, onAuthStateChanged, getIdToken } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
import { VoiceConverter, PERSONAS } from '/peer-voice.js';

const $ = (id) => document.getElementById(id);
// 表示名: メールアドレスはユーザー名(＠より前)に置換して表示
const uname = (s) => String(s||"").replace(/([A-Za-z0-9._%+-]+)@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g, "$1");
const setStatus = (m) => { const e=$("statusSb"); if(e) e.textContent=m; };
const setStatus2 = (m) => { const e=$("status2"); if(e) e.textContent=m; };

// 管理者判定(UE版はこのアカウントのみ)
const ADMIN_EMAIL = "gmhata@gmail.com";

// ルーム(生の名前 renshuN)
const roomRaw = (new URLSearchParams(location.search).get("room") || "renshu1").trim();
const roomNum = (roomRaw.match(/(\d+)/) || [,"?"])[1];
$("roomLabel").textContent = "ルーム" + roomNum;
$("ueLink").href = "/peer-patient.html?room=" + encodeURIComponent(roomRaw);

const app = initializeApp(window.FIREBASE_CONFIG);
const auth = getAuth(app);

let ROLE = null, joined = false;
let lkRoom = null, localTracks = [], camStream = null, canvasStream = null;

// ===== アバター(患者役) =====
function canon(s){ return String(s).toLowerCase().replace(/left$/,'l').replace(/right$/,'r').replace(/[^a-z0-9]/g,''); }
const FLOOR = 0.03;
const GAIN = {};
(function(){ const set=(n,g)=>{GAIN[canon(n)]=g;};
  [['eyeBlinkLeft',3.2],['eyeBlinkRight',3.2],['eyeLookInLeft',2.6],['eyeLookOutLeft',2.6],['eyeLookUpLeft',2.6],['eyeLookDownLeft',2.6],
   ['eyeLookInRight',2.6],['eyeLookOutRight',2.6],['eyeLookUpRight',2.6],['eyeLookDownRight',2.6],
   ['eyeSquintLeft',2.4],['eyeSquintRight',2.4],['eyeWideLeft',2.4],['eyeWideRight',2.4],
   ['cheekPuff',4.5],['cheekSquintLeft',2.6],['cheekSquintRight',2.6]].forEach(([n,g])=>set(n,g)); })();

let renderer, scene, camera, morphMeshes = [], headNode = null, headBone = null, faceLandmarker = null, avatarRunning = false, lastVideoTime = -1, currentAvatarUrl = null;
const APPLY_HEAD_POSE = true;   // 首の向き・傾きをHeadボーンに反映
const HEAD_POSE_GAIN = 1.0;     // 首振りの強さ(1.0=等倍)
// 顔の左右向き(yaw)の符号。'y'キーでその場反転、URL ?yaw=1 / ?yaw=-1 でも指定可。
let HEAD_YAW_SIGN = (new URLSearchParams(location.search).get('yaw')==='-1') ? -1 : 1;
window.addEventListener('keydown',(e)=>{ if(e.key==='y'||e.key==='Y'){ HEAD_YAW_SIGN*=-1; try{ setStatus('顔の向き: '+(HEAD_YAW_SIGN>0?'そのまま(+1)':'反転(-1)')+'  ※yキーで切替'); }catch(_){} } });
const targetHeadWorld = new THREE.Quaternion();
const headWorldRest = new THREE.Quaternion();
const headParentWorldInv = new THREE.Quaternion();
const _wd = new THREE.Quaternion(), _ld = new THREE.Quaternion();

function initThree(){
  const canvas = $("avatarCanvas");
  renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false, preserveDrawingBuffer:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2)); renderer.setSize(canvas.width, canvas.height, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x0f1216);
  // PBR環境光(内蔵RoomEnvironment, 外部アセット不要) — 肌の反射/質感が上がる
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  camera = new THREE.PerspectiveCamera(24, canvas.width/canvas.height, 0.1, 100); camera.position.set(0,0,3);
  const key=new THREE.DirectionalLight(0xfff4e6,1.6); key.position.set(1.2,1.8,2.4); scene.add(key);
  const fill=new THREE.DirectionalLight(0xdfe8ff,0.5); fill.position.set(-2,0.6,1.4); scene.add(fill);
  const rim=new THREE.DirectionalLight(0xffffff,0.7); rim.position.set(-0.5,1.5,-2.5); scene.add(rim);
  scene.add(new THREE.AmbientLight(0xffffff,0.25));
}
// 上半身フレーミング(頭〜腰)。手のしぐさが相手に見えるよう引きめ。
const UP_ZOOM = 1.28;
function frameUpper(rootObj){
  rootObj.updateMatrixWorld(true);
  let head=null, hips=null;
  rootObj.traverse(o=>{ if(o.isBone){ if(/^Head$/i.test(o.name)) head=o; if(/^Hips$/i.test(o.name)) hips=o; } });
  const hp = head?head.getWorldPosition(new THREE.Vector3()):new THREE.Vector3(0,1.5,0);
  const hipP = hips?hips.getWorldPosition(new THREE.Vector3()):new THREE.Vector3(0,0.9,0);
  const torso=Math.max(0.3, hp.y-hipP.y);
  const center=hp.clone(); center.y += torso*0.07; // 頭上に隙間(約1cm)を空けて少し下げる
  const half=torso*0.40; // 頭〜上胸まで(顔を大きく)
  const dist=half/Math.tan((camera.fov*Math.PI/180)/2);
  camera.position.set(center.x, center.y, center.z+dist);
  camera.near=Math.max(dist/100,0.01); camera.far=dist*100; camera.updateProjectionMatrix();
  camera.lookAt(center.x, center.y, center.z);
}
// ===== ペルソナ→リアルアバター(自ホスト同一オリジンGLB) =====
const DEFAULT_AVATAR = "/avatar-f-brunette.glb";
// キャラは声(persona)とセット。public/ に対応 .glb を置くと差し替わる。無ければ既定にフォールバック。
// 6種: kd=高齢男性 cd=中年男性 jd=若年男性 kj=高齢女性 cj=中年女性 jj=若年女性
const PERSONA_AVATAR = { none:DEFAULT_AVATAR, kd:"/avatar-kd.glb", cd:"/avatar-cd.glb", jd:"/avatar-jd.glb", kj:"/avatar-kj.glb", cj:"/avatar-cj.glb", jj:"/avatar-jj.glb" };
function avatarUrlFor(p){ return PERSONA_AVATAR[p] || DEFAULT_AVATAR; }
async function loadAvatar(url){
  const ktx2=new KTX2Loader().setTranscoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/basis/').detectSupport(renderer);
  const loader=new GLTFLoader().setKTX2Loader(ktx2).setMeshoptDecoder(MeshoptDecoder);
  const gltf=await loader.loadAsync(url);
  if(headNode){ try{ scene.remove(headNode); }catch(_){}} // 既存アバターを外して差し替え(キャラ切替)
  scene.add(gltf.scene); headNode=gltf.scene; currentAvatarUrl=url; morphMeshes=[]; headBone=null;
  gltf.scene.traverse(o=>{ if(o.isBone && /^Head$/i.test(o.name)) headBone=o; });
  gltf.scene.traverse(o=>{ if(o.isMesh && o.morphTargetDictionary && o.morphTargetInfluences){
    const ci={}; for(const [k,idx] of Object.entries(o.morphTargetDictionary)) ci[canon(k)]=idx; o.userData.canonIndex=ci; morphMeshes.push(o); } });
  frameUpper(gltf.scene);
  captureRig(gltf.scene);
  // 首振り用: Headボーンの静止ワールド姿勢と親の逆姿勢を記録
  if(headBone){
    headBone.updateWorldMatrix(true,false);
    headBone.getWorldQuaternion(headWorldRest);
    if(headBone.parent){ headBone.parent.getWorldQuaternion(headParentWorldInv); headParentWorldInv.invert(); }
    else headParentWorldInv.identity();
  }
}
// personaのアバターを読む。対応ファイルが無ければ既定アバターにフォールバック。
async function loadAvatarFor(persona){
  const url=avatarUrlFor(persona);
  try{ await loadAvatar(url); }
  catch(e){ if(url!==DEFAULT_AVATAR){ console.warn("avatar not found:",url,"→ 既定にフォールバック"); await loadAvatar(DEFAULT_AVATAR); } else throw e; }
}
// 通話中にキャラ(声とセット)を切り替える
async function switchAvatar(){
  if(!avatarRunning) return;
  const url=avatarUrlFor($("personaSelect").value);
  if(url===currentAvatarUrl) return;
  try{ setStatus("キャラクターを切り替え中…"); await loadAvatarFor($("personaSelect").value); setStatus("キャラクターを切り替えました。"); }
  catch(e){ setStatus("キャラ切替に失敗: "+((e&&e.message)||e)); }
}
async function initFace(){
  const fileset=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  const opts={ baseOptions:{ modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task', delegate:'GPU' }, outputFaceBlendshapes:true, outputFacialTransformationMatrixes:true, runningMode:'VIDEO', numFaces:1 };
  try { faceLandmarker=await FaceLandmarker.createFromOptions(fileset, opts); }
  catch(e){ opts.baseOptions.delegate='CPU'; faceLandmarker=await FaceLandmarker.createFromOptions(fileset, opts); }
  try { await initPose(fileset); } catch(e){}
  try { await initHands(fileset); } catch(e){}
}
function applyResults(res){
  dbgFace = (res.faceBlendshapes && res.faceBlendshapes.length)?1:0;
  if(res.faceBlendshapes && res.faceBlendshapes.length){
    const cats=res.faceBlendshapes[0].categories;
    for(const m of morphMeshes){ const ci=m.userData.canonIndex, inf=m.morphTargetInfluences;
      for(const c of cats){ if(c.categoryName==='_neutral') continue; const cn=canon(c.categoryName); const idx=ci[cn];
        if(idx!==undefined){ const g=GAIN[cn]; inf[idx]=g?Math.min(1,Math.max(0,c.score-FLOOR)*g):c.score; } } }
  }
  if(res.facialTransformationMatrixes && res.facialTransformationMatrixes.length){
    const m=new THREE.Matrix4().fromArray(res.facialTransformationMatrixes[0].data);
    const p=new THREE.Vector3(), s=new THREE.Vector3(), q=new THREE.Quaternion(); m.decompose(p,q,s);
    const eu=new THREE.Euler().setFromQuaternion(q,'YXZ'); eu.y*=HEAD_YAW_SIGN; targetHeadWorld.setFromEuler(eu);
  }
}
// ===== 手・腕・指トラッキング(MediaPipe) : dance_mocap方式(One Euro + 時間ベースslerp)を移植 =====
let poseLandmarker=null, handLandmarker=null;
// One Euroフィルタ: 静止時のブレを抑えつつ、速い動きにはほぼ遅延なく追従する適応ローパス
class OneEuro{ constructor(minCutoff=1.2,beta=0.5,dCutoff=1.0){ this.mc=minCutoff; this.beta=beta; this.dc=dCutoff; this.prev=null; this.dprev=0; this.tprev=0; }
  static a(c,dt){ const tau=1/(2*Math.PI*c); return 1/(1+tau/dt); }
  filter(v,t){ if(this.prev===null){ this.prev=v; this.dprev=0; this.tprev=t; return v; } const dt=Math.max(t-this.tprev,1e-3); this.tprev=t; const d=(v-this.prev)/dt; const ad=OneEuro.a(this.dc,dt); const sd=ad*d+(1-ad)*this.dprev; this.dprev=sd; const c=this.mc+this.beta*Math.abs(sd); const a=OneEuro.a(c,dt); const s=a*v+(1-a)*this.prev; this.prev=s; return s; } }
const ARM_K=14;                        // 腕の追従速度[1/s] (時間ベースslerp: t=1-exp(-k*dt) でフレームレート非依存)
let euroF={}, armParentWorld={}, armFore={}, armUpDir={}, armVis={};
let lastRigT=performance.now();
let lastDetMs=0;   // 認識の実行間隔を約22fpsに間引き(3モデル同時の過負荷でハンド検出が落ちるのを防ぐ)
let dbgFace=0, dbgPose=0, dbgHands=0;               // 検出状況(?debug=1 のときコンソール出力)
let lastLogMs=0;
const BUILD="2026-08-23-j";                          // ビルド識別子(コンソールで反映確認)
const DEBUG = new URLSearchParams(location.search).get('debug')==='1';
try{ console.log("PeerMontore build:", BUILD, DEBUG?"(debug)":""); }catch(_){}
function ef(key,val,t){ let f=euroF[key]; if(!f){ f=new OneEuro(); euroF[key]=f; } return f.filter(val,t); }
function fpt(prefix,p,t){ return { x:ef(prefix+'x',p.x,t), y:ef(prefix+'y',p.y,t), z:ef(prefix+'z',p.z,t) }; }
const FINGER_AXIS='x', FINGER_SIGN=1, FINGER_GAIN=1.1, THUMB_HOLD=true; // 確定: 指軸X・向き+・親指固定
const FSPEC=[ ['Thumb',[1,2,3],[0.5,1.1,0.9],'thumb'], ['Index',[1,2,3],[1.7,1.7,1.3],'index'], ['Middle',[1,2,3],[1.7,1.7,1.3],'middle'], ['Ring',[1,2,3],[1.7,1.7,1.3],'ring'], ['Pinky',[1,2,3],[1.6,1.6,1.2],'little'] ];
const ARM={}; let boneAxis={}, armDefaults={};
let fingerBones={}, fingerDefaults={}, fingerQ={}, thumbFlexAxis={};

const _av2=new THREE.Vector3();

function captureRig(rootObj){

  ARM.rightUpperArm=byName['RightArm']; ARM.rightLowerArm=byName['RightForeArm']; ARM.rightHand=byName['RightHand'];

  armDefaults={}; euroF={}; armParentWorld={}; armFore={}; armUpDir={}; armVis={};
  for(const k of ['leftUpperArm','leftLowerArm','rightUpperArm','rightLowerArm']){ const b=ARM[k]; if(b) armDefaults[k]=b.quaternion.clone(); }

  for(const side of ['Left','Right']){ const w=byName[side+'Hand'], iM=byName[side+'HandIndex1'], pM=byName[side+'HandPinky1']; let pnW=null;
    if(w&&iM&&pM){ const wp=w.getWorldPosition(new THREE.Vector3()), ip=iM.getWorldPosition(new THREE.Vector3()), pp=pM.getWorldPosition(new THREE.Vector3()); pnW=new THREE.Vector3().crossVectors(ip.clone().sub(wp), pp.clone().sub(wp)); if(pnW.lengthSq()>1e-10) pnW.normalize(); else pnW=null; }

const _KNEE=0.25,_CAP=0.40;
function shapeWorldDir(v){ if(v.z<0){ v.z=0; return v; } let z=v.z; if(z>_KNEE){ const over=z-_KNEE,range=_CAP-_KNEE; z=_KNEE+range*(1-1/(1+over/range)); } v.z=z; return v; }
function poseDirToWorld(from,to,out){ out.set(to.x-from.x, -(to.y-from.y), -(to.z-from.z)); return out; }
function aimBone(bone,defDir,worldDir,smooth){ if(!bone||!bone.parent) return; const len=worldDir.length(); if(len<1e-5) return; bone.parent.updateWorldMatrix(true,false); bone.parent.getWorldQuaternion(_q1); _q1.invert(); _av2.copy(worldDir).divideScalar(len).applyQuaternion(_q1); _q2.setFromUnitVectors(defDir,_av2); bone.quaternion.slerp(_q2,smooth); }
// 検出時: ランドマークをOne Euroで平滑し、上腕/前腕の「ワールド方向」を保存する。
// 実際のボーン適用はupdateArmsSmoothで毎フレーム(実際の親姿勢基準)行う=動作中も破綻しない。
function applyArms(res, tSec){
  const L=res.landmarks&&res.landmarks[0]; dbgPose=L?1:0; if(!L) return;
  const map={left:[11,13,15],right:[12,14,16]};
  for(const side of ['left','right']){
    const sI=map[side][0],eI=map[side][1],wI=map[side][2];
    const up=ARM[side+'UpperArm'], lo=ARM[side+'LowerArm']; if(!up||!lo) continue;
    const vis=(L[sI].visibility==null?1:L[sI].visibility);
    const eVis=(L[eI].visibility==null?1:L[eI].visibility);
    armVis[side]={ upper: vis>=0.3, lower: vis>=0.3 && eVis>=0.3 };
    if(vis<0.3){ armUpDir[side]=null; armFore[side]=null; continue; }
    const sh=fpt(side+'s',L[sI],tSec), el=fpt(side+'e',L[eI],tSec), wr=fpt(side+'w',L[wI],tSec);
    const dU=shapeWorldDir(poseDirToWorld(sh,el,new THREE.Vector3())); armUpDir[side]=dU.lengthSq()>1e-8?dU.normalize():null;
    const dL=shapeWorldDir(poseDirToWorld(el,wr,new THREE.Vector3())); armFore[side]=dL.lengthSq()>1e-8?dL.normalize():null;

const _asP=new THREE.Quaternion(), _asD=new THREE.Vector3(), _asT=new THREE.Quaternion();
// 毎フレーム: 上腕→前腕の順に、実際の親ボーンの現在ワールド姿勢を基準に目標を作り時間ベースで追従。
function updateArmsSmooth(dt){
  const t=1-Math.exp(-ARM_K*Math.max(dt,1e-3));
  for(const side of ['left','right']){
    const upKey=side+'UpperArm', loKey=side+'LowerArm';
    const up=ARM[upKey], lo=ARM[loKey]; if(!up||!lo) continue;
    const v=armVis[side]||{};
    // 上腕(親=肩の静止ワールド)
    if(v.upper && armUpDir[side] && armParentWorld[side]){
      _asD.copy(armUpDir[side]).applyQuaternion(_asP.copy(armParentWorld[side]).invert());
      _asT.setFromUnitVectors(boneAxis[upKey], _asD); up.quaternion.slerp(_asT, t);
    } else if(armDefaults[upKey]) up.quaternion.slerp(armDefaults[upKey], Math.min(t,0.1));
    up.updateWorldMatrix(true,false);
    // 前腕(親=上腕の“現在”ワールド=表示と一致)
    if(v.lower && armFore[side]){
      up.getWorldQuaternion(_asP); _asP.invert();
      _asD.copy(armFore[side]).applyQuaternion(_asP);
      _asT.setFromUnitVectors(boneAxis[loKey], _asD); lo.quaternion.slerp(_asT, t);
    } else if(armDefaults[loKey]) lo.quaternion.slerp(armDefaults[loKey], Math.min(t,0.1));
    lo.updateWorldMatrix(true,false);
  }
}
function computeFingerState(pts){ if(!pts||pts.length<21) return null; const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y); const curl=(m,pp,dp,t)=>{ const ext=d(pts[m],pts[pp])+d(pts[pp],pts[dp])+d(pts[dp],pts[t]); return Math.max(0,Math.min(1,(1-d(pts[m],pts[t])/Math.max(ext*0.8,0.001))*3.0)); }; return { index:curl(5,6,7,8), middle:curl(9,10,11,12), ring:curl(13,14,15,16), little:curl(17,18,19,20) }; }
function applyFingerCurl(Side,state){
  const defAxis=FINGER_AXIS==='x'?'x':'z';
  for(const sp of FSPEC){ const f=sp[0],joints=sp[1],weights=sp[2],key=sp[3];
    if(f==='Thumb'){ if(THUMB_HOLD){ for(const j of joints){ const b=fingerBones[Side+f+j], rq=fingerQ[Side+f+j]; if(b&&rq) b.quaternion.slerp(rq,0.3); } } continue; }

// 手が検出されない側の指は、直前の(握った)形で固まらないよう自然な開き(レスト)へ戻す

function applyHands(res){

// ===== 認識ソース: 全画面/拡大/非表示でも止まらないよう MediaStreamTrackProcessor でトラックから直接取得 =====
let procCanvas=null, procCtx=null, procReader=null, procHasFrame=false, useProc=false, procTrackRef=null;
function stopFrameSource(){ useProc=false; if(procReader){ try{ procReader.cancel(); }catch(e){} procReader=null; } if(procTrackRef){ try{ procTrackRef.stop(); }catch(e){} procTrackRef=null; } procHasFrame=false; }
async function pumpFrames(){
  while(useProc && procReader){
    let r; try{ r=await procReader.read(); }catch(e){ break; }
    if(r.done) break; const frame=r.value;
    try{ if(procCanvas.width!==frame.displayWidth||procCanvas.height!==frame.displayHeight){ procCanvas.width=frame.displayWidth; procCanvas.height=frame.displayHeight; } procCtx.drawImage(frame,0,0); procHasFrame=true; }catch(e){}
    try{ frame.close(); }catch(e){}
    if(avatarRunning && procHasFrame){ try{ processFrame(procCanvas); }catch(e){} }  // フレーム駆動: 全画面/非表示でも止まらない
  }
}
async function startFrameSource(track){
  stopFrameSource();
  if(window.MediaStreamTrackProcessor){
    try{
      procTrackRef=track;
      const proc=new MediaStreamTrackProcessor({ track });
      procReader=proc.readable.getReader();
      if(!procCanvas){ procCanvas=document.createElement('canvas'); procCtx=procCanvas.getContext('2d'); }
      useProc=true; procHasFrame=false; pumpFrames();
      return true;
    }catch(e){ useProc=false; procReader=null; procTrackRef=null; }
  }
  // フォールバック(Chrome以外): 隠しvideo。表示は保持して拡大時のデコード停止を回避。
  procTrackRef=track;
  $("camVideo").srcObject=new MediaStream([track]); try{ await $("camVideo").play(); }catch(e){}
  return false;
}
// 1フレーム分の処理(認識→腕/首の追従→描画)。rAFにもフレーム駆動(pumpFrames)にも使う。
function processFrame(ds){
  const nowMs=performance.now(); const dt=Math.min((nowMs-lastRigT)/1000, 0.1); lastRigT=nowMs;
  if(ds && (nowMs-lastDetMs)>=45){ lastDetMs=nowMs;   // 認識は約22fpsに間引き(過負荷でハンド検出が落ちるのを防止)
    if(faceLandmarker){ try{ applyResults(faceLandmarker.detectForVideo(ds, nowMs)); }catch(e){} }
    if(poseLandmarker){ try{ applyArms(poseLandmarker.detectForVideo(ds, nowMs+0.3), nowMs/1000); }catch(e){} }
    if(handLandmarker){ try{ applyHands(handLandmarker.detectForVideo(ds, nowMs+0.6)); }catch(e){} }
  }
  updateArmsSmooth(dt);
  if(APPLY_HEAD_POSE && headBone){ _wd.copy(targetHeadWorld).multiply(headWorldRest); _ld.copy(headParentWorldInv).multiply(_wd); headBone.quaternion.slerp(_ld, 0.35); }

  renderer.render(scene, camera);
  // 送信用に1フレーム明示要求(captureStream(0))。合成に依存せず全画面/非表示でも送れる
  if(canvasStream){ const _vt=canvasStream.getVideoTracks()[0]; if(_vt&&_vt.requestFrame) _vt.requestFrame(); }
}
// procパスは pumpFrames がフレーム駆動するのでrAFは描画しない。フォールバック(video)時のみrAFで駆動。
function avatarLoop(){
  if(!avatarRunning) return; requestAnimationFrame(avatarLoop);
  if(useProc) return;
  const v=$("camVideo"); let ds=null;
  if(v && v.readyState>=2 && v.currentTime!==lastVideoTime){ lastVideoTime=v.currentTime; ds=v; }
  processFrame(ds);
}

async function listCameras(){
  try{ const devs=await navigator.mediaDevices.enumerateDevices(); const cams=devs.filter(d=>d.kind==="videoinput");
    const sel=$("cameraSelect"); const cur=sel.value;
    sel.innerHTML='<option value="">既定のカメラ</option>'+cams.map((c,i)=>`<option value="${c.deviceId}">${c.label||("カメラ"+(i+1))}</option>`).join("");

}

// 通話中のカメラ切替
async function switchCamera(){
  if(!joined || !ROLE) return;
  const camId=$("cameraSelect").value;
  const vc = ROLE==="nurse" ? {width:{ideal:1280},height:{ideal:720}} : {width:{ideal:640},height:{ideal:480}};
  if(camId) vc.deviceId={exact:camId}; else vc.facingMode='user';
  let newStream;
  try{ newStream=await navigator.mediaDevices.getUserMedia({video:vc}); }
  catch(e){ setStatus("カメラ切替に失敗: "+(e&&e.message?e.message:e)); return; }
  const newTrack=newStream.getVideoTracks()[0]; if(!newTrack) return;
  const oldAudio = camStream ? camStream.getAudioTracks() : [];
  if(camStream){ camStream.getVideoTracks().forEach(t=>t.stop()); }
  if(ROLE==="patient"){
    // 公開トラックはアバターのまま。認識入力と自分の映像だけ差替。
    camStream=new MediaStream([newTrack, ...oldAudio]);
    $("localVideo").srcObject=new MediaStream([newTrack]);
    await startFrameSource(newTrack.clone());
  } else {
    // 看護師: 公開中の映像トラックを差替
    try{
      const pubs=lkRoom&&lkRoom.localParticipant&&lkRoom.localParticipant.videoTrackPublications ? Array.from(lkRoom.localParticipant.videoTrackPublications.values()) : [];
      const vpub=pubs.find(p=>p.track); if(vpub&&vpub.track&&vpub.track.replaceTrack){ await vpub.track.replaceTrack(newTrack); }
    }catch(e){ setStatus("カメラ切替に失敗: "+(e&&e.message?e.message:e)); }
    camStream=new MediaStream([newTrack, ...oldAudio]);
    $("localVideo").srcObject=new MediaStream([newTrack]);
  }
}
$("cameraSelect").addEventListener("change", ()=>{ if(joined) switchCamera(); });

      const camTrack=camStream.getVideoTracks()[0];
      $("localVideo").srcObject=new MediaStream([camTrack]); // 自分の映像(生カメラ・表示用)
      await startFrameSource(camTrack.clone());              // 認識用(全画面/拡大でも止まらない)
      setStatus2("リアルアバターと表情認識を準備中...(初回は少し時間がかかります)");
      initThree(); await loadAvatarFor($("personaSelect").value); await initFace(); avatarRunning=true; avatarLoop();
      const micStream=new MediaStream(camStream.getAudioTracks());
      audioTrack=await voice.start(micStream); applyVoice();
      canvasStream=$("avatarCanvas").captureStream(0); // 0=手動。processFrameでrequestFrame(全画面/非表示でも送信継続)
      { const _vt0=canvasStream.getVideoTracks()[0]; if(!(_vt0&&_vt0.requestFrame)) canvasStream=$("avatarCanvas").captureStream(30); } // requestFrame非対応は自動30fps
      videoTrack=canvasStream.getVideoTracks()[0];
    } else {
      const vids = camStream ? camStream.getVideoTracks() : [];
      const auds = camStream ? camStream.getAudioTracks() : [];
      videoTrack = vids[0] || null; audioTrack = auds[0] || null;
      $("localVideo").srcObject = videoTrack ? new MediaStream([videoTrack]) : null;
    }
    localTracks=[videoTrack, audioTrack].filter(Boolean);

    setStatus2("通話サーバへ接続中...");
    const { url, token }=await fetchToken(roomRaw, role);
    lkRoom=new LivekitClient.Room({ adaptiveStream:true, dynacast:true });
    lkRoom.on(LivekitClient.RoomEvent.TrackSubscribed,(t)=>attachRemoteTrack(t));
    lkRoom.on(LivekitClient.RoomEvent.ParticipantConnected,(p)=>{ setStatus("相手が入室しました: "+uname(p.name||p.identity)); });
    lkRoom.on(LivekitClient.RoomEvent.ParticipantDisconnected,()=>{ setStatus("相手が退室しました。"); const ph=$("stagePlaceholder"); if(ph) ph.classList.remove("hidden"); });
    lkRoom.on(LivekitClient.RoomEvent.Disconnected,()=>setStatus("切断されました。"));
    await lkRoom.connect(url, token);
    for(const t of localTracks){ await lkRoom.localParticipant.publishTrack(t, t.kind==="video"?{ videoCodec:"vp9", videoEncoding:{ maxBitrate:1_800_000, maxFramerate:30 } }:undefined); }

    joined=true;
    showCall(role);
    startHeartbeat();
    const rp = lkRoom.remoteParticipants ? Array.from(lkRoom.remoteParticipants.values())[0] : null;
    const others=lkRoom.remoteParticipants?lkRoom.remoteParticipants.size:0;
    const note = receiveOnly ? "(受信専用)" : "";
    const who = rp ? (": "+uname(rp.name||rp.identity)) : "";
    setStatus("入室しました"+note+"。"+(others?("相手は入室済みです"+who+"。"):"相手の入室を待っています..."));
  }catch(e){
    console.error(e);
    const raw=(e&&e.message)?e.message:String(e);
    const camBusy=(e&&e.name==='NotReadableError')||/could not start video source|in use|reserved|notreadable/i.test(raw);
    setStatus2(camBusy ? "カメラを開始できませんでした。他のタブやアプリ（Zoom・Teams・別の練習タブ等）がカメラを使用していないか確認し、閉じてから再度お試しください。" : ("エラー: "+raw));
    stopFrameSource();
    ROLE=null; $("pickNurse").disabled=false; $("pickPatient").disabled=false;
    showRoleSelection();
  }
}

// ===== 退室/交代 =====
async function teardown(){
  await stopHeartbeat();
  try{ if(lkRoom) await lkRoom.disconnect(); }catch(e){}
  lkRoom=null;
  avatarRunning=false;
  stopFrameSource();
  try{ voice.stop(); }catch(e){}
  localTracks.forEach(t=>t.stop()); localTracks=[];
  if(canvasStream){ canvasStream.getTracks().forEach(t=>t.stop()); canvasStream=null; }
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  $("camVideo").srcObject=null; $("localVideo").srcObject=null; $("remoteVideo").srcObject=null;
  const ra=$("remoteAudio"); if(ra) ra.remove();
  joined=false; ROLE=null;
  $("pickNurse").disabled=false; $("pickPatient").disabled=false;
}
$("swapBtn").addEventListener("click", async ()=>{ await teardown(); showRoleSelection(); setStatus2("役割を選び直してください（同じルームのままです）。"); });
$("leaveBtn").addEventListener("click", async ()=>{ await teardown(); location.href="/peer.html"; });

$("pickNurse").addEventListener("click", ()=> startRole("nurse"));
$("pickPatient").addEventListener("click", ()=> startRole("patient"));

// ===== 起動 =====
onAuthStateChanged(auth, (user)=>{
  if(user){
    $("loginUser").textContent = "ログイン中: " + (uname(user.email)||user.email||"");
    // UE版は管理者アカウントのみ
    $("ueRow").classList.toggle("hidden", (user.email||"").toLowerCase()!==ADMIN_EMAIL);
    $("loginPanel").classList.add("hidden");
    showRoleSelection();
    setupCameras();
  } else {
    stopRoomOcc();
    $("loginPanel").classList.remove("hidden");
    $("loginMsg").innerHTML = 'montoreにログインが必要です。<a href="/index.html">メニューからログイン</a>してから、ロビー経由で開いてください。';
    $("rolePanel").classList.add("hidden");
    $("callView").classList.add("hidden");
  }
});
</script>
