<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ライブアバター</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5fbff;
        --panel: rgba(255, 255, 255, 0.9);
        --border: rgba(125, 211, 252, 0.38);
        --ink: #16324f;
        --sub: #527188;
        --accent: #0ea5a8;
        --accent-strong: #0f766e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Yu Gothic UI", "Hiragino Sans", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(167, 243, 208, 0.5), transparent 26%),
          radial-gradient(circle at top right, rgba(125, 211, 252, 0.5), transparent 25%),
          linear-gradient(180deg, #f8fdff 0%, #f3fbff 52%, #ebf8ff 100%);
      }

      .shell {
        width: min(1280px, calc(100vw - 40px));
        margin: 0 auto;
        padding: 74px 0 14px;
      }

      .hero {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 14px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 3.7vw, 3rem);
        line-height: 1;
        letter-spacing: -0.05em;
      }

      .hero p {
        margin: 8px 0 0;
        font-size: 0.95rem;
        line-height: 1.55;
        color: var(--sub);
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 11px 16px;
        border-radius: 999px;
        border: 1px solid rgba(20, 184, 166, 0.2);
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 12px 32px rgba(15, 118, 110, 0.1);
        font-weight: 700;
        color: var(--accent-strong);
      }

      .status-dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #fb7185;
        box-shadow: 0 0 0 6px rgba(251, 113, 133, 0.12);
      }

      .status-dot.active {
        background: #14b8a6;
        box-shadow: 0 0 0 6px rgba(20, 184, 166, 0.14);
      }

      .stage {
        display: grid;
        grid-template-columns: minmax(0, 1.02fr) minmax(0, 0.98fr);
        gap: 22px;
      }

      .panel {
        position: relative;
        display: flex;
        flex-direction: column;
        min-height: 0;
        border: 1px solid var(--border);
        border-radius: 32px;
        background: var(--panel);
        box-shadow: 0 30px 90px rgba(14, 116, 144, 0.12);
        overflow: hidden;
        backdrop-filter: blur(18px);
      }

      .panel-header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 14px;
        min-height: 64px;
        padding: 16px 20px 0;
      }

      .panel-title {
        font-size: 1.14rem;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .panel-note {
        font-size: 0.88rem;
        line-height: 1.2;
        color: var(--sub);
        white-space: nowrap;
      }

      .avatar-tools {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        justify-self: end;
      }

      .avatar-load-btn {
        border: 1px solid rgba(125, 211, 252, 0.42);
        background: rgba(255, 255, 255, 0.92);
        color: var(--accent-strong);
        border-radius: 999px;
        padding: 8px 14px;
        font: inherit;
        font-size: 0.82rem;
        font-weight: 700;
        cursor: pointer;
      }

      .avatar-load-btn:hover {
        background: rgba(240, 249, 255, 0.96);
      }

      .camera-wrap,
      .avatar-wrap {
        position: relative;
        margin: 14px 18px 14px;
        border-radius: 26px;
        overflow: hidden;
        background: linear-gradient(180deg, #091726, #0e243b);
        min-height: 0;
        flex: 1;
      }

      #cameraFrame,
      #avatarViewport {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 0;
      }

      #cameraFrame video,
      #cameraFrame canvas,
      #avatarViewport canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #cameraFrame video,
      #cameraFrame canvas {
        position: absolute;
        inset: 0;
      }

      #cameraFrame video {
        object-fit: cover;
        transform: scaleX(-1);
      }

      #overlayCanvas {
        pointer-events: none;
      }

      #avatarViewport {
        background:
          radial-gradient(circle at 50% 24%, rgba(147, 197, 253, 0.36), transparent 24%),
          radial-gradient(circle at 50% 72%, rgba(20, 184, 166, 0.22), transparent 28%),
          linear-gradient(180deg, #071321 0%, #102540 46%, #0d2137 100%);
      }

      #avatarViewport canvas {
        position: absolute;
        inset: 0;
      }

      #modelInput {
        display: none;
      }

      .camera-overlay {
        display: none;
        position: absolute;
        inset: auto 18px 18px;
        padding: 12px 14px;
        border-radius: 18px;
        background: rgba(7, 19, 33, 0.68);
        color: #ecfeff;
        font-size: 0.88rem;
        line-height: 1.5;
        backdrop-filter: blur(12px);
      }

      .camera-overlay.error {
        display: block;
        background: rgba(127, 29, 29, 0.82);
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        padding: 0 18px 16px;
      }

      .stat {
        padding: 12px 12px 11px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid rgba(191, 219, 254, 0.72);
      }

      .stat-label {
        display: block;
        margin-bottom: 4px;
        font-size: 0.74rem;
        color: var(--sub);
      }

      .stat-value {
        font-size: 1.02rem;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      @media (min-width: 981px) {
        html,
        body {
          height: 100%;
          overflow: hidden;
        }

        .shell {
          min-height: 100vh;
          height: 100vh;
          display: grid;
          grid-template-rows: auto minmax(0, 1fr);
        }

        .stage {
          min-height: 0;
        }
      }

      @media (max-width: 980px) {
        .shell {
          width: min(100vw - 24px, 1280px);
          padding-top: 74px;
        }

        .hero {
          flex-direction: column;
          align-items: flex-start;
        }

        .stage {
          grid-template-columns: 1fr;
        }

        .panel-header {
          grid-template-columns: 1fr;
          align-items: flex-start;
        }

        .panel-note {
          white-space: normal;
        }

        .avatar-tools {
          justify-self: stretch;
        }
      }

      @media (max-width: 640px) {
        .camera-wrap,
        .avatar-wrap {
          margin: 14px;
        }

        .panel-header {
          padding: 18px 18px 0;
        }

        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          padding: 0 14px 14px;
        }
      }

      .tune-panel {
        margin: 0 18px 14px;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.82);
        font-size: 0.82rem;
        color: var(--ink);
      }

      .tune-panel > summary {
        cursor: pointer;
        font-weight: 700;
        color: var(--accent-strong);
        list-style: none;
        padding: 2px 0;
      }

      .tune-panel[open] > summary {
        margin-bottom: 8px;
      }

      .tune-panel > summary::after {
        content: " ▸";
        font-size: 0.7em;
        opacity: 0.6;
      }
      .tune-panel[open] > summary::after {
        content: " ▾";
      }

      .tune-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px 14px;
      }

      .tune-row {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 6px;
      }

      .tune-row label {
        font-size: 0.78rem;
        color: var(--sub);
        grid-column: 1 / -1;
        display: flex;
        justify-content: space-between;
      }

      .tune-row input[type="range"] {
        grid-column: 1 / -1;
        width: 100%;
      }

      .tune-row select {
        grid-column: 1 / -1;
        font: inherit;
        padding: 4px 6px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #fff;
      }

      .tune-row .tune-val {
        font-weight: 700;
        color: var(--ink);
      }

      .tune-sign {
        font: inherit;
        font-weight: 700;
        width: 30px;
        height: 26px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #fff;
        color: var(--accent-strong);
        cursor: pointer;
      }

      .tune-row.inline {
        grid-template-columns: 1fr auto;
      }
      .tune-row.inline label {
        grid-column: auto;
      }

      .tune-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 8px;
      }

      .tune-reset {
        font: inherit;
        font-size: 0.78rem;
        padding: 5px 12px;
        border-radius: 999px;
        border: 1px solid rgba(125, 211, 252, 0.42);
        background: rgba(240, 249, 255, 0.9);
        color: var(--accent-strong);
        cursor: pointer;
      }

      @media (max-width: 640px) {
        .tune-grid {
          grid-template-columns: 1fr;
        }
      }

      /* Debug-only UI (debug button, tune panel). Hidden by default; show
         by appending ?debug=1 to the URL (handled in app.js init). */
      .dev-only {
        display: none !important;
      }
      .dev-only.dev-on {
        display: revert !important;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
          "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"
        }
      }
    </script>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <h1>ライブアバター</h1>
          <p>左のカメラ映像とポイントを読み取りながら、右の 3D アバターが表情としぐさを連動して映します。</p>
        </div>
        <div class="status-pill">
          <span id="statusDot" class="status-dot"></span>
          <span id="statusText">カメラを起動しています</span>
        </div>
      </section>

      <section class="stage">
        <article class="panel">
          <div class="panel-header">
            <div class="panel-title">カメラ入力</div>
            <div class="panel-note">顔と手のポイントを重ねて表示</div>
          </div>
          <div class="camera-wrap">
            <div id="cameraFrame">
              <video id="video" autoplay playsinline muted></video>
              <canvas id="overlayCanvas" width="640" height="480"></canvas>
            </div>
            <div id="cameraOverlay" class="camera-overlay"></div>
          </div>
          <div class="stats">
            <div class="stat">
              <span class="stat-label">顔の向き</span>
              <span id="yawValue" class="stat-value">0°</span>
            </div>
            <div class="stat">
              <span class="stat-label">うなずき</span>
              <span id="pitchValue" class="stat-value">0°</span>
            </div>
            <div class="stat">
              <span class="stat-label">まばたき</span>
              <span id="blinkValue" class="stat-value">0%</span>
            </div>
            <div class="stat">
              <span class="stat-label">口の開き</span>
              <span id="mouthValue" class="stat-value">0%</span>
            </div>
          </div>
        </article>

        <article class="panel">
          <div class="panel-header">
            <div class="panel-title">3D アバター</div>
            <div class="avatar-tools">
              <div id="avatarModelNote" class="panel-note">頭の向き、目、口、手の位置を 3D で反映</div>
              <button id="debugDumpButton" class="avatar-load-btn dev-only" type="button" style="background:#fef3c7;border-color:#fbbf24;color:#78350f;">デバッグ</button>
              <button id="loadModelButton" class="avatar-load-btn" type="button">モデル読込</button>
            </div>
          </div>
          <div class="avatar-wrap">
            <div id="avatarViewport" aria-label="3D avatar viewport"></div>
          </div>
          <details class="tune-panel dev-only">
            <summary>調整（手・指）</summary>
            <div class="tune-grid">
              <div class="tune-row">
                <label>手のひらひねり 左<span class="tune-val" id="tuneValPalmL">0.00</span></label>
                <input id="tunePalmL" type="range" min="-1.6" max="1.6" step="0.05" />
              </div>
              <div class="tune-row">
                <label>手のひらひねり 右<span class="tune-val" id="tuneValPalmR">0.00</span></label>
                <input id="tunePalmR" type="range" min="-1.6" max="1.6" step="0.05" />
              </div>
              <div class="tune-row">
                <label>手のひら 追従量<span class="tune-val" id="tuneValPalmFollow">0.80</span></label>
                <input id="tunePalmFollow" type="range" min="-2" max="2" step="0.05" />
              </div>
              <div class="tune-row">
                <label>指カールの強さ<span class="tune-val" id="tuneValFingerGain">1.00</span></label>
                <input id="tuneFingerGain" type="range" min="0" max="2" step="0.05" />
              </div>
              <div class="tune-row inline">
                <label>指カールの軸</label>
                <select id="tuneFingerAxis">
                  <option value="z">Z軸（既定）</option>
                  <option value="x">X軸</option>
                </select>
              </div>
              <div class="tune-row inline">
                <label>指の符号（左 / 右）</label>
                <span>
                  <button id="tuneFingerSignL" class="tune-sign" type="button">−</button>
                  <button id="tuneFingerSignR" class="tune-sign" type="button">+</button>
                </span>
              </div>
            </div>
            <div class="tune-actions">
              <button id="tuneReset" class="tune-reset" type="button">リセット</button>
            </div>
          </details>
          <input id="modelInput" type="file" accept=".vrm,.glb,.gltf,model/gltf-binary,model/gltf+json" />
        </article>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
